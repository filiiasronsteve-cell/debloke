<style>
:root{
  --bg:#F3F4F6; --card:#fff; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --brand:#8E1B2E; --brand-2:#6E1222; --brand-soft:#F7E8EA; --cream:#F6E7C8; --on-brand:#fff; --accent2:#1D4ED8;
  --ok:#0F7B4F; --ok-soft:#E7F5EE; --warn:#B45309; --warn-soft:#FDF1E3; --err:#C0352B; --err-soft:#FCE9E7;
  --hdr-bg:#F3F4F6; --hdr-ink:#111827; --logo:#8E1B2E; --nav-bg:#111827; --nav-ink:#9CA3AF; --nav-act:#fff; --toast:#111827;
  --hero-bg:#fff; --hero-ink:#111827; --hero-muted:#6B7280; --tile:#F7F8FA;
  --font:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --font-num:var(--font);
  --radius:20px; --shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px rgba(17,24,39,.06); color-scheme:light;
}
:root[data-theme="nwit"]{
  --bg:#0D0F14; --card:#161A22; --ink:#F3F4F6; --muted:#8B93A7; --line:#262B36;
  --brand:#C6F36B; --brand-2:#A8D84E; --brand-soft:rgba(198,243,107,.12); --cream:#C6F36B; --on-brand:#0D0F14; --accent2:#7AA2FF;
  --ok:#C6F36B; --ok-soft:rgba(198,243,107,.12); --warn:#FFB86B; --warn-soft:rgba(255,184,107,.12); --err:#FF8A65; --err-soft:rgba(255,138,101,.13);
  --hdr-bg:#0D0F14; --hdr-ink:#F3F4F6; --logo:#C6F36B; --nav-bg:#0D0F14; --nav-ink:#6B7385; --nav-act:#C6F36B; --toast:#262B36;
  --hero-bg:#161A22; --hero-ink:#F3F4F6; --hero-muted:#8B93A7; --tile:#1E232D;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --font-num:"Space Grotesk",var(--font);
  --radius:20px; --shadow:0 0 0 1px #222733; color-scheme:dark;
}
:root[data-theme="mache"]{
  --bg:#F5F6FB; --card:#fff; --ink:#141B3D; --muted:#5B6385; --line:#E3E6F0;
  --brand:#22307A; --brand-2:#151F55; --brand-soft:#E8EBF8; --cream:#FFB547; --on-brand:#fff; --accent2:#FF6B5A;
  --ok:#1A8C76; --ok-soft:#DDF5EF; --warn:#C77800; --warn-soft:#FFF1DB; --err:#D9412F; --err-soft:#FFE4E0;
  --hdr-bg:#22307A; --hdr-ink:#fff; --logo:#FFB547; --nav-bg:#fff; --nav-ink:#8A90AB; --nav-act:#22307A; --toast:#141B3D;
  --hero-bg:#22307A; --hero-ink:#fff; --hero-muted:rgba(255,255,255,.72); --tile:rgba(255,255,255,.12);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --font-num:var(--font);
  --radius:22px; --shadow:0 8px 24px rgba(20,27,61,.07); color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--hdr-bg);color:var(--hdr-ink);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header .logo{font-weight:800;letter-spacing:.5px;font-size:18px;color:var(--logo);font-family:var(--font-num)}
header .who{font-size:13px;opacity:.85;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;border:0;cursor:pointer}
.pill.on{background:#E6F3E6;color:#1F5E22}.pill.off{background:#FCF0DE;color:#7A4300}.pill.busy{background:var(--cream);color:var(--brand-2)}
.test{background:#FFD54A;color:#3A2A00;text-align:center;font-size:12px;font-weight:700;padding:3px}
main{padding:12px 16px calc(104px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;background:var(--nav-bg);border-radius:22px;display:flex;padding:4px 6px;max-width:616px;margin:0 auto;box-shadow:0 10px 30px rgba(17,24,39,.18)}
:root[data-theme="nwit"] nav{left:0;right:0;bottom:0;border-radius:0;max-width:none;border-top:1px solid #1E232D;box-shadow:none;padding:4px 6px env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 2px 8px;font-size:12px;color:var(--nav-ink);font-weight:600;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .i{display:flex;line-height:1}nav button .i svg{width:22px;height:22px}
nav button.act{color:var(--nav-act);font-weight:800}
:root[data-theme="mache"] nav button.act{background:var(--brand);color:#fff}
nav .badge{background:var(--err);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-left:2px}
h2{font-size:18px;margin:14px 0 8px}
h3{font-size:15px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:700;font-size:16px}
.sub{color:var(--muted);font-size:13px}
.money{font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--font-num)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.err{background:var(--err-soft);color:var(--err)}.tag.n{background:var(--line);color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;background:var(--brand);color:var(--on-brand);margin:8px 0}
.btn.sec{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn{margin:0}
.btns > *{min-width:0}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none;min-height:48px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
.big{font-size:26px;font-weight:800;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}
.chip.sel{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.search{position:sticky;top:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:20;background:var(--toast);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;box-shadow:var(--shadow);max-width:600px;margin:0 auto}
.toast.err{background:var(--err)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.gps{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.gps.ok{background:var(--ok-soft);color:var(--ok)}.gps.wait{background:var(--warn-soft);color:var(--warn)}.gps.err{background:var(--err-soft);color:var(--err)}
.photo{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--line);display:block}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--brand-soft);color:var(--brand);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;cursor:pointer}
.av.big{width:76px;height:76px;font-size:26px}
img.av{border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:10px}
.viewer .x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;color:#fff;font-size:30px;background:none;border:0}
.upd{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 64px);z-index:40;background:var(--brand-2);color:var(--on-brand);border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;max-width:600px;margin:0 auto;cursor:pointer;box-shadow:var(--shadow)}
.search.row input{flex:1}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:10px 12px;margin-top:10px}
.eta{font-size:12px;color:var(--brand);font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.eta:empty{display:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dot.big{width:14px;height:14px;margin:0}
.mapbox{isolation:isolate;z-index:0;position:relative;height:min(60vh,560px);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-2,0 8px 24px rgba(0,0,0,.15));margin-top:10px;background:#e8e2da}
#map{position:absolute;inset:0}
.fab{position:absolute;right:12px;bottom:22px;z-index:500;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:22px;cursor:pointer}
.legend{position:absolute;left:10px;bottom:22px;z-index:500;background:rgba(255,255,255,.94);color:#2B1B1E;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);line-height:1.7;max-width:55%}
.legend:empty{display:none}
.pin{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font:800 12px/1 system-ui,sans-serif;box-shadow:0 3px 8px rgba(0,0,0,.35);position:relative}
.pin::after{content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--c)}
.pin.num,.pin.ag{background:var(--c);color:#fff;border-color:#fff}
.pin.num::after,.pin.ag::after{border-top-color:#fff}
.me{width:20px;height:20px;border-radius:50%;background:#1F6FB2;border:3px solid #fff;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,111,178,.55)}70%{box-shadow:0 0 0 18px rgba(31,111,178,0)}100%{box-shadow:0 0 0 0 rgba(31,111,178,0)}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
.tl{border-left:3px solid var(--line);margin:4px 0 0 10px;padding-left:14px}
.tl .it{position:relative;margin:0 0 10px}

.num{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.pop{font:14px/1.35 system-ui,sans-serif}
.pop .pb{display:flex;gap:6px;margin-top:8px}

.pop .pb a{background:#F7E8EA;color:#8E1B2E!important}
.leaflet-popup-content-wrapper{border-radius:14px}
nav button{font-size:11px}
.kod{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--brand);letter-spacing:.3px}
.switch{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;margin-top:10px}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login .mark{width:72px;height:72px;border-radius:22px;background:var(--brand);color:var(--on-brand);font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.err-msg{color:var(--err);font-weight:600;margin-top:8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--brand)}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:26px;padding:18px;margin:0 0 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .lbl{font-size:13px;font-weight:700;color:var(--hero-muted)}
.hero .tot{font-family:var(--font-num);font-size:42px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}

.hero .tile{background:var(--tile);border-radius:16px;padding:10px 12px;min-width:0}
.hero .tile span{display:block;font-size:12px;font-weight:600;color:var(--hero-muted)}
.hero .tile b{display:block;font-family:var(--font-num);font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .ft{font-size:12px;color:var(--hero-muted);margin-top:10px}
:root[data-theme="mache"] .hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:#FFB547;opacity:.18;right:-50px;top:-60px}
:root[data-theme="nwit"] .hero{background:radial-gradient(circle at 100% 0,rgba(198,243,107,.16),transparent 60%),var(--card)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--line);border-radius:16px;padding:4px;margin-top:14px}
.seg button{height:40px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(17,24,39,.12)}
:root[data-theme="nwit"] .seg{background:#0D0F14}
:root[data-theme="nwit"] .seg button.on{background:var(--brand);color:var(--on-brand)}
.amt{text-align:center;margin-top:16px}
.amt label{margin:0;font-size:13px}
.amt-row{display:flex;align-items:baseline;justify-content:center;gap:6px}
.amt-row input{border:0;background:transparent;padding:0;width:auto;min-width:1ch;max-width:72%;text-align:center;font-family:var(--font-num);font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1.15;color:var(--ink);caret-color:var(--brand)}
.amt-row span{font-size:20px;font-weight:700;color:var(--muted)}
.amt .hint{font-size:13px;font-weight:700;color:var(--warn);min-height:18px}
.chips.c{justify-content:center}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.pad button{height:52px;border:0;border-radius:14px;background:var(--card);font-family:var(--font-num);font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.pad button:active{transform:scale(.97);background:var(--brand-soft)}
details.more{margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
details.more summary{font-weight:700;color:var(--muted);cursor:pointer;font-size:14px}
.cta{min-height:58px;font-size:17px;box-shadow:0 10px 24px rgba(17,24,39,.18)}
.dots{display:flex;justify-content:space-between;gap:6px;margin-top:12px}
.dots i{flex:1;max-width:44px;aspect-ratio:1;border-radius:50%;background:var(--line);color:var(--muted);font:800 13px/1 var(--font-num);font-style:normal;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.dots i.ok{background:var(--ok);color:var(--card)}
:root[data-theme="nwit"] .dots i.ok{color:#0D0F14}
.dots i.late{background:var(--err-soft);color:var(--err);border:2px dashed var(--err)}
.dots i svg{width:16px;height:16px}
.segs{display:flex;gap:4px;margin-top:10px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs i.ok{background:var(--ok)}.segs i.late{background:var(--err)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.minis div{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.minis span{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.minis b{display:block;font-family:var(--font-num);font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof{text-align:center;padding-top:4px}
.prof .av.big{width:92px;height:92px;font-size:30px;margin:0 auto;border:4px solid var(--card);box-shadow:var(--shadow)}
.prof .name{font-size:21px!important;margin-top:8px}
.locc{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-top:12px;text-decoration:none;color:var(--ink)}
.locc .ic{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.grid7 .chip,.grid4 .chip{padding:10px 0;border-radius:12px;text-align:center;font-family:var(--font-num)}
:root[data-theme="mache"] .grid4 .chip.sel{background:var(--cream);border-color:var(--cream);color:#141B3D}
.sumdark{background:#141B3D;color:#fff;border-radius:22px;padding:16px;margin-top:14px;position:relative;overflow:hidden}
:root[data-theme="nwit"] .sumdark{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.sumdark::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:var(--cream);opacity:.16;right:-30px;bottom:-50px}
.sumdark .r{display:flex;justify-content:space-between;gap:8px}
.sumdark .l{font-size:13px;opacity:.72;font-weight:600}
.sumdark .v{font-family:var(--font-num);font-size:24px;font-weight:800}
.sumdark .n{font-size:12px;opacity:.65;margin-top:6px}

const DB = {
  _db: null,
  open(){ return this._db || (this._db = new Promise((ok, ko) => {
    const r = indexedDB.open("debloke-ajan", 1);
    r.onupgradeneeded = () => { const d = r.result;
      d.createObjectStore("kv"); d.createObjectStore("outbox", { keyPath: "seq", autoIncrement: true }); d.createObjectStore("photos"); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  })); },
  async tx(store, mode, fn){ const d = await this.open(); return new Promise((ok, ko) => {
    const t = d.transaction(store, mode), s = t.objectStore(store); let res;
    Promise.resolve(fn(s)).then(v => res = v);
    t.oncomplete = () => ok(res); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); }); },
  req(r){ return new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  get(store, k){ return this.tx(store, "readonly", s => this.req(s.get(k))); },
  set(store, k, v){ return this.tx(store, "readwrite", s => k === undefined ? this.req(s.put(v)) : this.req(s.put(v, k))); },
  del(store, k){ return this.tx(store, "readwrite", s => this.req(s.delete(k))); },
  all(store){ return this.tx(store, "readonly", s => this.req(s.getAll())); },
  clear(store){ return this.tx(store, "readwrite", s => this.req(s.clear())); }
};

/* ================= API SUPABASE ================= */
class ApiErr extends Error { constructor(msg, status, code){ super(msg); this.status = status; this.code = code; } }
async function http(path, { method = "GET", body, headers = {}, auth = true, raw = false } = {}){
  const h = { apikey: CFG.key, ...headers };
  if (auth) { await ensureToken(); h.Authorization = "Bearer " + S.session.access_token; }
  if (body !== undefined && !(body instanceof Blob)) { h["Content-Type"] = "application/json"; body = JSON.stringify(body); }
  let r;
  try { r = await fetch(CFG.url + path, { method, headers: h, body }); }
  catch (e) { throw new ApiErr("Pa gen koneksyon", 0, "network"); }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok) {
    const msg = (j && (j.message || j.msg || j.error_description || j.erè || j.error)) || ("Erè " + r.status);
    throw new ApiErr(msg, r.status, j && (j.code || j.error_code));
  }
  return raw ? txt : j;
}

  const nav = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "";

function setSession(j){
  S.session = { access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in || 3600)), user_id: j.user && j.user.id };
  save("session");
}
async function ensureToken(){
  if (!S.session) throw new ApiErr("Ou pa konekte", 401, "no_session");
  if (S.session.expires_at - 60 > Date.now()/1000) return;
  try {
    const j = await http("/auth/v1/token?grant_type=refresh_token", { method: "POST", auth: false, body: { refresh_token: S.session.refresh_token } });
    setSession(j);
  } catch (e) {
    if (e.status === 0) throw e;
    S.needRelogin = true; throw new ApiErr("Sesyon an fini. Konekte ankò (done ki pa voye yo ap rete).", 401, "relogin");
  }
}

/* ================= GPS ================= */
function getGPS(timeout = 20000){
  // Si swivi an dirèk la fèk bay yon bon pozisyon (< 20 s), sèvi avè l : pi rapid, epi kèk telefòn bloke 2 demann GPS an menm tan
  const fresh = maxMs => S.pos && Date.now() - Date.parse(S.pos.at) < maxMs && S.pos.acc <= 200 ? { lat: S.pos.lat, lng: S.pos.lng, acc: S.pos.acc, at: S.pos.at } : null;
  const f = fresh(120000); if (f) return Promise.resolve(f);
  return new Promise(res => {
    if (!navigator.geolocation) return res({ err: "Telefòn sa a pa gen GPS." });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: new Date(p.timestamp).toISOString() }),
      e => res(e.code !== 1 && fresh(120000) || { err: e.code === 1 ? "Ou pa bay app la otorizasyon GPS. Aktive l nan paramèt telefòn nan." : "GPS la pa jwenn pozisyon. Ale deyò oswa eseye ankò." }),
      { enableHighAccuracy: true, timeout, maximumAge: 10000 });
  });
}
const gpsHtml = g => !g ? '<div class="gps wait">📍 Ap chèche pozisyon GPS…</div>'
  : g.err ? '<div class="gps err">📍 ' + esc(g.err) + '</div>'
  : g.acc > 200 ? '<div class="gps err">📍 Pozisyon pa presi ase (±' + g.acc + ' m). Eseye ankò.</div>'
  : '<div class="gps ok">📍 Pozisyon anrejistre (±' + g.acc + ' m)</div>';

/* ================= FOTO ================= */
function compressImage(file, max = 1280, q = 0.72){
  return new Promise((ok, ko) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : ko(new Error("foto")), "image/jpeg", q); };
    img.onerror = () => { URL.revokeObjectURL(u); ko(new Error("Foto a pa ka li.")); };
    img.src = u;
  });
}

/* Afichaj foto : "local:<id>" (poko voye), "dbk:<chemen>" (depo prive Debloke), oswa yon lyen https */
const PH = new Map();
const photoRef = c => c._photo ? "local:" + c._photo : c.photo_path ? "dbk:" + c.photo_path : c.photo_bs || c.photo || null;
const initials = c => (((c.prenom || "?")[0] || "") + ((c.nom || "")[0] || "")).toUpperCase();
function avatar(c, big){
  const ref = photoRef(c), cl = "av" + (big ? " big" : "");
  return ref ? '<img class="' + cl + '" data-ph="' + esc(ref) + '" alt="Foto ' + esc(c.prenom || "") + '">' : '<span class="' + cl + '">' + esc(initials(c)) + '</span>';
}
async function photoUrl(ref){
  if (PH.has(ref)) return PH.get(ref);
  let url = null, b = null;
  if (/^https?:\/\//.test(ref)) url = ref;
  else if (ref.startsWith("local:")) b = await DB.get("photos", ref.slice(6));
  else if (ref.startsWith("dbk:")) {
    const path = ref.slice(4);
    b = await DB.get("photos", "p:" + path);
    if (!b && S.online && S.session) {
      try { await ensureToken();
        const r = await fetch(CFG.url + "/storage/v1/object/authenticated/" + CFG.bucket + "/" + path, { headers: { apikey: CFG.key, Authorization: "Bearer " + S.session.access_token } });
        if (r.ok) { b = await r.blob(); DB.set("photos", "p:" + path, b); } } catch {}
    }
  }
  if (b) url = URL.createObjectURL(b);
  if (url) PH.set(ref, url);
  return url;
}

}

/* Distans an mèt ant 2 pwen GPS */
function distM(a, b){ const R = 6371000, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa/2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo/2) ** 2; return Math.round(2 * R * Math.asin(Math.sqrt(h))); }

async function enqueue(kind, payload, label){
  const item = { kind, payload, label, created: new Date().toISOString(), status: "pending", error: null, user_id: S.moi && S.moi.user_id };
  item.seq = await DB.set("outbox", undefined, item);
  S.outbox.push(item); renderBadge();
  if (S.online) sync();
  return item;
}

async function pushOne(it){
  const p = it.payload;
  switch (it.kind) {
    case "photo": {
      const blob = await DB.get("photos", p.key);
      if (blob) {
        try { await http("/storage/v1/object/" + CFG.bucket + "/" + p.path, { method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" } }); }
        catch (e) { if (!(e.status === 409 || /exists|duplicate/i.test(e.message))) throw e; }   // deja voye
        await DB.set("photos", "p:" + p.path, blob);   // kenbe l sou telefòn nan pou l parèt san entènèt
        await DB.del("photos", p.key);
      }
      return;
    }
    case "inscrire": {
      const r = await rpc("debloke_inscrire_client", p);
      const c = S.clients.find(x => x.id === p.p_id);
      if (r && r.code_client && c && c.code_client !== r.code_client) {
        // moun nan te deja nan baz la (li kenbe kòd li) oswa yon lòt moun te gen menm kòd la
        if (c.code_client) {
          toast("Kòd " + c.prenom + " " + c.nom + " : " + c.code_client + " → " + r.code_client);
          S.codeChg.unshift({ id: "loc-" + c.id, client_id: r.client_id || c.id, agent_id: S.moi.user_id, ancien_code: c.code_client, nouveau_code: r.code_client,
            raison: r.deja_kliyan_debloke ? "kliyan_egziste" : "kod_pran", cree_le: new Date().toISOString(), _nom: c.prenom + " " + c.nom, _local: true });
          save("codeChg");
        }
        c.code_client = r.code_client; save("clients");
      }
      return r;
    }
    case "ouvrir": {
      const r = await rpc("debloke_ouvrir_compte", p);
      const k = S.comptes.find(x => x.id === p.p_id); if (k && r && r.numero) { k.numero = r.numero; k._local = false; save("comptes"); }
      return r;
    }
    case "gps": return rpc("debloke_enregistrer_gps_commerce", p);
    case "tx":
      try { return await ins("debloke_transactions", p); }
      catch (e) { if (e.code === "23505") return; throw e; }      // deja voye
    case "off":
      try { return await ins("debloke_jours_off", p); }
      catch (e) { if (e.code === "23505") return; throw e; }
    case "cycle":
      try { return await ins("debloke_cycles", p); }
      catch (e) { if (e.code === "23505") return; throw e; }
    case "cloture": return rpc("debloke_cloturer_cycle", p);
    case "remplacement":
      try { return await ins("debloke_remplacements", p); }
      catch (e) { if (e.code === "23505") return; throw e; }
    case "annule_rp": return patch("debloke_remplacements", "id=eq." + p.id, { annule: true });
    case "transfert": return rpc("debloke_transferer_client", p);
    case "avance": return rpc("debloke_avance_saisir", p);
    case "code_ok": return rpc("debloke_code_corrige", p);
    case "avance_ok": return rpc("debloke_avance_confirmer", p);
    case "avance_x": return rpc("debloke_avance_annuler", p);
  }
}

async function sync(manual){
  if (S.syncing) return;
  if (!S.online) { if (manual) toast("Pa gen entènèt. Done yo ap voye lè entènèt tounen.", true); return; }
  S.syncing = true; renderNet();
  let ok = 0, fail = 0;
  try {
    const items = (await DB.all("outbox")).filter(i => i.status !== "done");
    for (const it of items) {
      if (it.user_id && S.moi && it.user_id !== S.moi.user_id) continue;   // pa voye done yon lòt ajan
      try { await pushOne(it); await DB.del("outbox", it.seq); ok++; }
      catch (e) {
        if (e.status === 0) throw e;                                    // koneksyon koupe : kanpe
        if (e.code === "relogin") throw e;
        it.status = "error"; it.error = e.message; it.tries = (it.tries || 0) + 1; await DB.set("outbox", undefined, it); fail++;
      }
    }
    await pushPositions();
    try {
      const r = await rpc("debloke_appareil_ping", { p_device: await deviceId(), p_en_attente: await pendingMine(), p_info: deviceInfo() });
      if (r && r.actif === false) { S.syncing = false; await kickOut(r.raison); return; }
    } catch (e) { if (e.status === 0 || e.code === "relogin") throw e; }
    await pull();
    S.lastSync = new Date().toISOString(); save("lastSync");
    if (manual || ok || fail) toast(fail ? (fail + " operasyon pa pase. Gade nan Senk.") : (ok ? ok + " operasyon voye ✔" : "Tout bagay ajou ✔"), !!fail);
  } catch (e) {
    if (e.code === "relogin") { toast(e.message, true); showLogin(true); }
    else if (manual) toast(e.message, true);
  } finally {
    S.outbox = await DB.all("outbox"); S.syncing = false; renderNet(); renderBadge(); render();
  }
}

async function pull(){
  const [moi, clients, comptes, cycles, baremes] = await Promise.all([
    sel("debloke_personnel", "select=user_id,nom,role,telephone&user_id=eq." + S.session.user_id),
    sel("debloke_v_clients", "select=*&order=nom.asc"),
    sel("debloke_comptes", "select=id,numero,client_id,statut,limite_autorisee,date_ouverture&order=date_ouverture.desc"),
    sel("debloke_v_cycles", "select=*&statut=not.in.(Annulé)&order=date_debut.desc&limit=500"),
    sel("debloke_baremes_frais", "select=frais_journalier&actif=eq.true&order=frais_journalier.asc")
  ]);
  const ids = cycles.filter(c => !/Terminé/.test(c.statut) || c.date_debut >= addDays(today(), -30)).map(c => c.id);
  let tx = [];
  if (ids.length) tx = await sel("debloke_transactions", "select=id,cycle_id,type,montant,sens,affectation,date_operation,mode_paiement,capture_le,agent_id&order=capture_le.desc&limit=1000&cycle_id=in.(" + ids.join(",") + ")");
  if (moi[0]) { S.moi = moi[0]; save("moi"); }
  try {
    const cc = await sel("debloke_codes_changes", "select=*&corrige_le=is.null&order=cree_le.desc");
    const pendOk = new Set((await DB.all("outbox")).filter(i => i.kind === "code_ok").map(i => i.payload.p_id));
    S.codeChg = cc.filter(x => !pendOk.has(x.id)); save("codeChg");
  } catch (e) { console.warn("codes", e); }
  try {
    const av = await sel("debloke_avances", "select=*&statut=neq.Annul%C3%A9&date_jour=gte." + addDays(today(), -2) + "&order=saisi_le.asc");
    const pendAv = await DB.all("outbox");
    const loc = S.avances.filter(a => a._local && pendAv.some(i => (i.kind === "avance" && i.payload.p_id === a.id) || (i.kind === "avance_ok" && i.payload.p_id === a.id)));
    S.avances = av.filter(a => !loc.some(l => l.id === a.id)).concat(loc).filter(a => a.statut !== "Annulé"); save("avances");
  } catch (e) { console.warn("avances", e); }
  if (isMgr()) {
    const [eq, rp] = await Promise.all([
      sel("debloke_personnel", "select=user_id,nom,role,telephone,actif&order=nom.asc"),
      sel("debloke_remplacements", "select=*&annule=eq.false&au=gte." + addDays(today(), -1) + "&order=du.asc")
    ]);
    S.equipe = eq; S.remplacements = rp; save("equipe"); save("remplacements");
    try { S.appareils = await sel("debloke_appareils", "select=*"); save("appareils"); } catch (e) { console.warn("appareils", e); }
  }
  // Kenbe done lokal ki poko pase
  const pend = await DB.all("outbox");
  const pendClients = new Set(pend.filter(i => i.kind === "inscrire").map(i => i.payload.p_id));
  const pendComptes = new Set(pend.filter(i => i.kind === "ouvrir").map(i => i.payload.p_id));
  const pendCycles = new Set(pend.filter(i => i.kind === "cycle").map(i => i.payload.id));
  const pendClot = new Map(pend.filter(i => i.kind === "cloture").map(i => [i.payload.p_cycle, i.payload.p_date_fin]));
  const pendTx = new Set(pend.filter(i => i.kind === "tx").map(i => i.payload.id));
  S.clients = clients.concat(S.clients.filter(c => c._local && pendClients.has(c.id) && !clients.some(x => x.id === c.id)));
  S.comptes = comptes.concat(S.comptes.filter(c => c._local && pendComptes.has(c.id) && !comptes.some(x => x.id === c.id)));
  S.cycles = cycles.concat(S.cycles.filter(y => y._local && pendCycles.has(y.id) && !cycles.some(x => x.id === y.id)));
  S.cycles.forEach(y => { if (pendClot.has(y.id) && isOpen(y)) { y.statut = "Terminé"; y._closing = true; } });
  const localTx = S.tx.filter(t => t._local && pendTx.has(t.id) && !tx.some(x => x.id === t.id));
  S.tx = tx.concat(localTx);
  localTx.forEach(applyTxLocal);
  S.baremes = baremes.map(b => Number(b.frais_journalier));
  for (const k of ["clients","comptes","cycles","tx","baremes"]) await save(k);
}
function addDays(s, n){ const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }

/* Kalandriye lokal (pou cycle kreye san entènèt) : menm règ ak sèvè a */
function calcLocal(y){
  const off = new Set(y.jours_repos || []), jours = [];
  for (let d = y.date_debut, i = 0; jours.length < y.nb_jours_prevu && i < 60; d = addDays(d, 1), i++) {
    const dow = new Date(d + "T12:00:00").getDay();
    if ((y.dimanches_exclus && dow === 0) || off.has(dow)) continue;
    jours.push(d);
  }
  const fin = y.date_fin_reelle && y.date_fin_reelle < today() ? y.date_fin_reelle : today();
  y.date_fin_prevue = jours[jours.length - 1]; y.date_limite = y.prolonge_jusqu_au || y.date_fin_prevue;
  y.jours_consommes = jours.filter(d => d <= fin).length;
  y.frais_dus = y.jours_consommes * y.frais_journalier; y.frais_total_prevu = y.nb_jours_prevu * y.frais_journalier;
  y.frais_en_retard = Math.max(0, y.frais_dus - (+y.frais_payes || 0));
  y.fonds_a_restituer = +y.fonds_debloques - (+y.fonds_restitue || 0);
  return y;
}

/* Mete chif cycle la ajou lokalman (san entènèt) */
function applyTxLocal(t){
  const c = S.cycles.find(x => x.id === t.cycle_id); if (!c) return;
  const m = Number(t.montant);
  if (t.type === "Paiement frais") { c.frais_payes = +c.frais_payes + m; c.frais_en_retard = Math.max(0, +c.frais_dus - c.frais_payes); }
  if (t.type === "Restitution du fonds") { c.fonds_restitue = +c.fonds_restitue + m; c.fonds_a_restituer = +c.fonds_debloques - c.fonds_restitue; }
  if (t.type === "Déblocage du fonds") { c.fonds_decaisse = +c.fonds_decaisse + m; if (c.statut === "Prévu") c.statut = "Actif"; }
  if (t.type === "Pénalité") { c.penalites_payees = +c.penalites_payees + m; }
}

    + (isMgr() && c.agent_id ? '<div>Ajan</div><div>' + esc(nomAgent(c.agent_id)) + '</div>' : '')
    + (isMgr() && c.correspondance ? '<div>Doublon</div><div>' + ({ nouveau: "Nouvo moun", nif: "Konekte pa NIF", telephone: "Konekte pa telefòn", a_verifier: '<span class="tag err">A verifye</span> telefòn oswa NIF sa a egziste deja pou lòt moun' }[c.correspondance] || esc(c.correspondance)) + '</div>' : '') + '</div></div>'
    + (!gps ? '<button class="btn sec" id="cGps" type="button">📍 Mwen nan biznis li : anrejistre pozisyon an</button>'
      : isMgr() && !c._local ? '<button class="btn ghost" id="cGps" type="button">📍 Korije pozisyon biznis la (mwen la kounye a)</button>' : '')
    + '<h3>Kont</h3>' + (ks.length ? ks.map(k => '<div class="card"><div class="row"><div class="grow name">' + esc(k._local ? "Nouvo kont (ap tann)" : k.numero) + '</div><span class="tag ' + (k.statut === "Actif" ? "ok" : "n") + '">' + esc(k.statut) + '</span></div></div>').join("")
      : '<div class="sub">Pa gen kont.</div><button class="btn" id="cOpen" type="button">Ouvri yon kont Debloke</button>')
    + (kActif && !ys.some(isOpen) ? '<button class="btn" id="cCyc" type="button">➕ Nouvo cycle</button>' : '')
    + '<h3>Cycle</h3>' + (ys.length ? ys.map(cycleCard).join("") : '<div class="sub">Pa gen cycle.</div>'));
  const g = $("#cGps"); if (g) g.onclick = () => captureGpsFor(c);
  const o = $("#cOpen"); if (o) o.onclick = () => openCompte(c);
  const n = $("#cCyc"); if (n) n.onclick = () => openNewCycle(c, kActif);
}

async function captureGpsFor(c){
  if (c.gps_statut === "Capturé" && !await ask("Ranplase pozisyon biznis la ak kote w ye kounye a?")) return;
  const box = document.createElement("div"); box.innerHTML = gpsHtml(null); $("#cGps").replaceWith(box);
  const g = await getGPS(); box.innerHTML = gpsHtml(g);
  if (g.err || g.acc > 200) return;
  await enqueue("gps", { p_client: c.id, p_lat: g.lat, p_lng: g.lng, p_precision: g.acc, p_capture_le: g.at }, "GPS " + c.prenom + " " + c.nom);
  c._gpsPending = true; save("clients"); toast("Pozisyon anrejistre ✔"); render();
}

async function openCompte(c){
  const kid = uuid();
  const atBiz = await ask({ icon: "pin", title: "Ou nan biznis kliyan an?", msg: "Si w la kounye a, app la ap anrejistre pozisyon GPS biznis la.", ok: "Wi, anrejistre GPS", cancel: "Non, pita" });
  let g = null;
  if (atBiz && c.gps_statut !== "Capturé") { toast("Ap chèche pozisyon GPS…"); g = await getGPS(); if (g.err || g.acc > 200) { toast((g.err || "GPS pa presi ase") + " Kont lan ap ouvri san GPS.", true); g = null; } }
  await enqueue("ouvrir", { p_id: kid, p_client: c.id, p_gps_lat: g && g.lat, p_gps_lng: g && g.lng, p_gps_precision: g && g.acc, p_capture_le: (g && g.at) || new Date().toISOString() }, "Kont " + c.prenom + " " + c.nom);
  S.comptes.push({ id: kid, client_id: c.id, numero: "(ap tann)", statut: "Actif", _local: true }); save("comptes");
  if (g) { c._gpsPending = true; save("clients"); }
  toast("Kont lan anrejistre ✔"); openClient(c.id);
}

/* ---------- Operasyon sou yon cycle ---------- */
function openCycle(id){
  const y = S.cycles.find(x => x.id === id); if (!y) return;
  const c = clientOfCycle(y);
  const hist = S.tx.filter(t => t.cycle_id === id).sort((a, b) => String(b.capture_le).localeCompare(String(a.capture_le))).slice(0, 15);
  const late = +y.frais_en_retard > 0;
  sheet('<div class="row">' + (c ? avatar(c) : '') + '<div class="grow"><div class="name" style="font-size:19px">' + esc(c ? c.prenom + " " + c.nom : "") + '</div><div class="sub">' + esc(y.numero) + ' · ' + esc(y.statut) + '</div></div>'
    + (late ? '<span class="tag err">Reta ' + htg(y.frais_en_retard) + '</span>' : isOpen(y) ? '<span class="tag ok">Ajou</span>' : '') + '</div>'
    + '<div class="card" style="margin-top:12px"><div class="row"><div class="grow"><div class="sub" style="font-weight:700">' + htg(y.frais_journalier) + ' / jou</div><div class="name">Jou ' + (y.jours_consommes || 0) + ' sou ' + y.nb_jours_prevu + '</div></div><div class="sub">fen ' + dmy(y.date_limite) + '</div></div>' + dayDots(y) + '</div>'
    + '<div class="minis"><div><span>Fon debloke</span><b>' + htg(y.fonds_decaisse) + '</b></div><div><span>Frè peye</span><b style="color:var(--ok)">' + htg(y.frais_payes) + '</b></div><div><span>Pou remèt</span><b style="color:var(--warn)">' + htg(y.fonds_a_restituer) + '</b></div></div>'
    + '<div class="card" style="margin-top:12px"><div class="kv">'
    + '<div>Fon debloke</div><div class="money">' + htg(y.fonds_decaisse) + ' / ' + htg(y.fonds_debloques) + '</div>'
    + '<div>Frè pa jou</div><div class="money">' + htg(y.frais_journalier) + '</div>'
    + '<div>Jou konsome</div><div>' + (y.jours_consommes || 0) + ' / ' + y.nb_jours_prevu + ' (fen ' + dmy(y.date_limite) + ')</div>'
    + '<div>Frè dwe</div><div class="money">' + htg(y.frais_dus) + '</div>'
    + '<div>Frè peye</div><div class="money">' + htg(y.frais_payes) + '</div>'
    + '<div>Frè an reta</div><div class="money" style="color:' + (+y.frais_en_retard > 0 ? "var(--err)" : "inherit") + '">' + htg(y.frais_en_retard) + '</div>'
    + '<div>Pou remèt</div><div class="money">' + htg(y.fonds_a_restituer) + '</div></div></div>'
    + (isOpen(y) ? '<div class="btns">'
      + '<button class="btn" data-op="Paiement frais" type="button">Peye frè</button>'
      + '<button class="btn" data-op="Restitution du fonds" type="button">Remèt fon</button>'
      + '<button class="btn sec" data-op="Déblocage du fonds" type="button">Debloke</button>'
      + '<button class="btn sec" data-op="Pénalité" type="button">Penalite</button></div>'
      + '<button class="btn ghost" id="yOff" type="button">📅 Kliyan an p ap la yon jou</button>'
      + '<button class="btn ghost" id="yClose" type="button">✅ Fèmen cycle la (kliyan an fini)</button>' : '')
    + '<h3>Dènye operasyon</h3>' + (hist.length ? hist.map(t => '<div class="row sub" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="grow">' + dmy(t.date_operation) + ' · ' + esc(t.type) + (t._local ? ' · <b>ap tann</b>' : '') + '</span><span class="money">' + htg(t.montant) + '</span></div>').join("") : '<div class="sub">Okenn.</div>'));
  document.querySelectorAll("[data-op]").forEach(b => b.onclick = () => openOp(y, b.dataset.op));
  const o = $("#yOff"); if (o) o.onclick = () => openOff(y);
  const cl = $("#yClose"); if (cl) cl.onclick = () => closeCycle(y);
}

async function closeCycle(y){
  const rest = +y.fonds_a_restituer;
  if (rest > 0 && !isMgr()) return toast("Kliyan an poko remèt tout fon an (rete " + htg(rest) + "). Anrejistre remèt fon an anvan.", true);
  const c = clientOfCycle(y);
  if (!await ask({ icon: "check", title: "Fèmen cycle la jodi a?", rows: [["Kliyan", c ? c.prenom + " " + c.nom : "—"], ["Cycle", y._local ? "cycle sa a" : y.numero], ["Jou konsome", (y.jours_consommes || 0) + " / " + y.nb_jours_prevu], ["Frè dwe", htg(y.frais_dus)]]
      .concat(+y.frais_en_retard > 0 ? [["Frè an reta", htg(y.frais_en_retard)]] : []).concat(rest > 0 ? [["Pou remèt", htg(rest)]] : []),
      msg: "Kliyan an peye sèlman jou li konsome yo.", tone: (+y.frais_en_retard > 0 || rest > 0) ? "danger" : "", ok: "Fèmen cycle la" })) return;
  await enqueue("cloture", { p_cycle: y.id, p_date_fin: today() }, "Fèmen cycle · " + (c ? c.prenom + " " + c.nom : ""));
  y.date_fin_reelle = today(); y.statut = rest > 0 || +y.frais_en_retard > 0 ? "Terminé avec écart" : "Terminé"; y._closing = true; save("cycles");
  closeSheet(); toast("Cycle fèmen ✔"); render();
}

/* ---------- Nouvo cycle (ajan an kreye l sou teren) ---------- */
function openNewCycle(c, k, opts = {}){
  const fr = S.baremes.length ? S.baremes : CFG.frais;
  const lim = k && k.limite_autorisee ? Number(k.limite_autorisee) : null;
  // Ranpli otomatik apati dènye cycle kont lan (kliyan an ka renouvle menm kondisyon yo)
  const prev = k ? cyclesOfCompte(k.id).slice().sort((x, y) => String(y.date_debut).localeCompare(String(x.date_debut)))[0] : null;
  let jou = prev ? +prev.nb_jours_prevu : 3, frais = prev && fr.includes(+prev.frais_journalier) ? +prev.frais_journalier : null,
      dim = prev ? prev.dimanches_exclus !== false : true, deb = true;
  const nbAv = k ? cyclesOfCompte(k.id).length : 0;
  sheet('<div class="row"><div class="name grow" style="font-size:20px">Nouvo cycle</div>' + (opts.fromPicker ? '<button class="pill busy" id="ncChg" type="button">Chanje kont</button>' : '') + '</div>'
    + '<div class="card" style="margin-top:10px"><div class="row">' + avatar(c, true) + '<div class="grow"><div class="name">' + esc(c.prenom + " " + c.nom) + '</div>'
    + '<div class="sub">' + kodHtml(c.code_client, c.telephone) + '</div></div></div>'
    + '<div class="kv" style="margin-top:8px"><div>Kont</div><div><b>' + esc(k ? (k._local ? "Nouvo kont (ap tann)" : k.numero) : "Nouvo kont · ap ouvri otomatikman") + '</b></div>'
    + '<div>Cycle anvan</div><div>' + nbAv + (prev ? ' · dènye a : ' + htg(prev.fonds_debloques) + ', ' + prev.nb_jours_prevu + ' jou, ' + htg(prev.frais_journalier) + '/jou' : '') + '</div>'
    + (lim ? '<div>Limit kont lan</div><div class="money">' + htg(lim) + '</div>' : '') + '</div></div>'
    + (prev ? '<div class="sub">Montan, jou ak frè yo soti nan dènye cycle a. Chanje sa ki pa bon.</div>' : '')
    + '<label for="ncM">Montan pou debloke (HTG) *</label><div class="amtin"><input id="ncM" class="big" style="text-align:left;font-family:var(--font-num);border-color:var(--brand)" type="number" inputmode="numeric" min="1" step="50" value="' + (prev ? Math.round(prev.fonds_debloques) : "") + '">' + (lim ? '<span class="lim">Limit ' + htg(lim) + '</span>' : '') + '</div>'
    + '<label>Konbyen jou *</label><div class="grid7" id="ncJ">' + [1,2,3,4,5,6,7].map(n => '<button class="chip' + (n === jou ? " sel" : "") + '" data-j="' + n + '" type="button">' + n + '</button>').join("") + '</div>'
    + '<label>Frè pa jou (HTG) *</label><div class="grid4" id="ncF">' + fr.map(f => '<button class="chip' + (f === frais ? " sel" : "") + '" data-f="' + f + '" type="button">' + f + '</button>').join("") + '</div>'
    + '<label for="ncD">Dat kòmansman</label><input id="ncD" type="date" value="' + today() + '" min="' + addDays(today(), -7) + '">'
    + '<label class="switch"><input id="ncDim" type="checkbox"' + (dim ? " checked" : "") + '><span><b>Pa konte dimanch</b></span></label>'
    + '<label class="switch"><input id="ncDeb" type="checkbox" checked><span><b>M ap bay kliyan an kòb la kounye a</b><br><span class="sub">Déblocage a ap anrejistre an menm tan.</span></span></label>'
    + '<div class="sumdark" id="ncSum"></div>'
    + '<button class="btn cta" id="ncOk" type="button">Kreye cycle la</button><button class="btn ghost" id="ncNo" type="button">Anile</button>');
  const sum = () => { const m = Number($("#ncM").value) || 0, y = calcLocal({ date_debut: $("#ncD").value || today(), nb_jours_prevu: jou, dimanches_exclus: dim, frais_journalier: frais || 0, fonds_debloques: m });
    $("#ncSum").innerHTML = '<div class="r l"><span>Frè total (' + jou + ' jou)</span><span>Fen cycle</span></div>'
      + '<div class="r" style="align-items:baseline;margin-top:4px"><span class="v">' + htg(jou * (frais || 0)) + '</span><span style="font-weight:700">' + dmy(y.date_fin_prevue) + '</span></div>'
      + '<div class="r l" style="margin-top:8px"><span>Kliyan an ap remèt</span><span style="font-weight:800;opacity:1">' + htg(m) + '</span></div>'
      + '<div class="n">Si li fini bone, li peye sèlman jou li konsome yo.</div>';
    $("#ncOk").textContent = m > 0 && deb ? "Kreye cycle la · debloke " + htg(m) : "Kreye cycle la"; };
  document.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { jou = +b.dataset.j; document.querySelectorAll("[data-j]").forEach(x => x.classList.toggle("sel", x === b)); sum(); });
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { frais = +b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("sel", x === b)); sum(); });
  $("#ncM").oninput = sum; $("#ncD").onchange = sum; $("#ncDim").onchange = e => { dim = e.target.checked; sum(); }; $("#ncDeb").onchange = e => { deb = e.target.checked; sum(); }; sum();
  $("#ncNo").onclick = closeSheet;
  const chg = $("#ncChg"); if (chg) chg.onclick = openCyclePicker;
  $("#ncOk").onclick = async () => {
    const m = Math.round(Number($("#ncM").value)), d = $("#ncD").value;
    if (!(m > 0)) return toast("Mete montan an.", true);
    if (lim && m > lim) return toast("Montan an depase limit kont lan (" + htg(lim) + ").", true);
    if (!frais) return toast("Chwazi frè pa jou a.", true);
    if (!d) return toast("Chwazi dat kòmansman an.", true);
    if (!await ask({ icon: "cycle", title: "Nouvo cycle", big: htg(m), rows: [["Kliyan", c.prenom + " " + c.nom], ["Jou", String(jou)], ["Frè pa jou", htg(frais)], ["Frè total", htg(jou * frais)]], msg: deb ? "W ap bay kliyan an " + htg(m) + " kounye a." : "", ok: "Kreye cycle la" })) return;
    $("#ncOk").disabled = true;
    if (!k) {   // kliyan an pa gen kont : ouvri youn otomatikman
      const kid = uuid();
      await enqueue("ouvrir", { p_id: kid, p_client: c.id, p_capture_le: new Date().toISOString() }, "Kont " + c.prenom + " " + c.nom);
      k = { id: kid, client_id: c.id, numero: "(ap tann)", statut: "Actif", _local: true }; S.comptes.push(k); save("comptes");
    }
    const row = { id: uuid(), compte_id: k.id, date_debut: d, nb_jours_prevu: jou, fonds_debloques: m, frais_journalier: frais, dimanches_exclus: dim };
    await enqueue("cycle", row, "Cycle " + jou + " jou · " + htg(m) + " · " + c.prenom + " " + c.nom);
    const y = calcLocal({ ...row, numero: "(ap tann)", statut: "Prévu", jours_repos: [], frais_payes: 0, fonds_restitue: 0, fonds_decaisse: 0, penalites_payees: 0, _local: true });
    S.cycles.unshift(y);
    if (deb) {
      let g = null; try { g = await getGPS(8000); } catch {}
      const okg = g && !g.err && g.acc <= 500;
      const t = { id: uuid(), cycle_id: row.id, type: "Déblocage du fonds", montant: m, date_operation: today(), mode_paiement: "Espèces", reference: null, commentaire: null,
        agent_id: S.moi.user_id, gps_lat: okg ? g.lat : null, gps_lng: okg ? g.lng : null, gps_precision_m: okg ? g.acc : null, capture_le: new Date().toISOString(), appareil: (navigator.userAgent || "").slice(0, 120) };
      await enqueue("tx", t, "Déblocage " + htg(m) + " · " + c.prenom + " " + c.nom);
      S.tx.unshift({ ...t, _local: true }); applyTxLocal(t); save("tx");
    }
    save("cycles"); toast("Cycle kreye ✔" + (S.online ? "" : " (ap voye lè entènèt tounen)"));
    if (opts.back) { closeSheet(); render(); } else openClient(c.id);
  };
}

/* Fòm "Nouvo cycle" : chèche kont kliyan an (non, kòd, nimewo kont, telefòn) */
function openCyclePicker(){
  const items = S.clients.map(c => {
    const k = comptesOf(c.id).find(x => x.statut === "Actif"), open = cyclesOfClient(c.id).find(isOpen);
    return { c, k, open, s: (c.prenom + " " + c.nom + " " + (c.code_client || "") + " " + (c.telephone || "") + " " + (k && k.numero || "")).toLowerCase() };
  }).sort((a, b) => (!!a.open - !!b.open) || (a.c.nom + a.c.prenom).localeCompare(b.c.nom + b.c.prenom));
  const row = (it, i) => '<div class="card" data-pk="' + i + '" data-s="' + esc(it.s) + '" style="' + (it.open ? "opacity:.55" : "") + '"><div class="row">' + avatar(it.c)
    + '<div class="grow"><div class="name" style="font-size:15px">' + esc(it.c.prenom + " " + it.c.nom) + '</div><div class="sub">' + kodHtml(it.c.code_client, it.k ? (it.k._local ? "Nouvo kont" : it.k.numero) : "Pa gen kont", it.c.telephone) + '</div></div>'
    + (it.open ? '<span class="tag n">Cycle louvri</span>' : it.k ? '<span class="tag ok">Disponib</span>' : '<span class="tag warn">Kont ap ouvri</span>') + '</div></div>';
  sheet('<div class="name" style="font-size:20px">Nouvo cycle</div>'
    + '<label for="pkQ">Kont kliyan *</label><input id="pkQ" type="search" placeholder="🔎 Non, kòd kliyan, nimewo kont oswa telefòn…" autocomplete="off">'
    + '<div id="pkL" style="margin-top:10px">' + (items.length ? items.map(row).join("") : '<div class="empty">Pa gen kliyan. Kreye yon kliyan an premye.</div>') + '</div>', true);
  const q = $("#pkQ"); setTimeout(() => q.focus(), 50);
  q.oninput = () => { const v = q.value.trim().toLowerCase(); document.querySelectorAll("[data-pk]").forEach(e => e.classList.toggle("hidden", !!v && !e.dataset.s.includes(v))); };
  document.querySelectorAll("[data-pk]").forEach(e => e.onclick = () => {
    const it = items[+e.dataset.pk];
    if (it.open) return toast(it.c.prenom + " gen yon cycle ki poko fèmen. Fèmen l anvan.", true);
    openNewCycle(it.c, it.k || null, { fromPicker: true, back: true });
  });
}

/* ================= EKRAN MANAGER ================= */
function apHtml(p){
  const a = S.appareils.find(x => x.user_id === p.user_id);
  if (!a || !a.device_id) return '<div class="aprow"><span class="sub">Pa konekte sou okenn telefòn</span></div>';
  return '<div class="aprow"><span class="grow sub"><b style="color:var(--ink)">' + esc(a.info || "Telefòn") + '</b><br>Dènye fwa : ' + (a.derniere_vue ? hm(a.derniere_vue) : '—')
    + (a.en_attente ? ' · <b style="color:var(--warn)">' + a.en_attente + ' operasyon ap tann</b>' : '') + '</span>'
    + (p.user_id !== S.moi.user_id ? '<button class="btn ghost" data-libere="' + p.user_id + '" type="button" style="width:auto;margin:0;padding:9px 12px;font-size:13px">Dekonekte telefòn</button>' : '<span class="tag ok">Telefòn sa a</span>') + '</div>';
}
function renderEkip(m){
  const open = S.cycles.filter(isOpen);
  const parAgent = {};
  open.forEach(y => { const c = clientOfCycle(y), a = (c && c.agent_id) || "?"; const o = parAgent[a] = parAgent[a] || { n: 0, dehors: 0, reta: 0 };
    o.n++; o.dehors += Math.max(0, +y.fonds_a_restituer); o.reta += +y.frais_en_retard || 0; });
  const tot = Object.values(parAgent).reduce((s, o) => ({ n: s.n + o.n, dehors: s.dehors + o.dehors, reta: s.reta + o.reta }), { n: 0, dehors: 0, reta: 0 });
  const agents = S.equipe.filter(p => p.actif !== false);
  const opt = (list, ph) => '<option value="">' + ph + '</option>' + list.map(p => '<option value="' + p.user_id + '">' + esc(p.nom) + ' (' + esc(p.role) + ')</option>').join("");
  m.innerHTML = '<h2>Ekip</h2><div class="card"><div class="kv"><div>Cycle aktif</div><div><b>' + tot.n + '</b></div><div>Fon deyò</div><div class="money">' + htg(tot.dehors) + '</div><div>Frè an reta</div><div class="money">' + htg(tot.reta) + '</div></div></div>'
    + '<h3>Pa ajan</h3>' + (Object.keys(parAgent).length ? Object.entries(parAgent).map(([a, o]) => '<div class="card"><div class="row"><div class="grow"><div class="name">' + esc(nomAgent(a) || "—") + '</div><div class="sub">' + o.n + ' cycle · fon deyò ' + htg(o.dehors) + '</div></div>' + (o.reta > 0 ? '<span class="tag warn">Reta ' + htg(o.reta) + '</span>' : '<span class="tag ok">Ajou</span>') + '</div></div>').join("") : '<div class="sub">Pa gen cycle aktif.</div>')
    + '<h3>Ranplasman</h3>' + (S.remplacements.length ? S.remplacements.map(r => '<div class="card"><div class="row"><div class="grow"><div class="name" style="font-size:15px">' + esc(nomAgent(r.remplacant)) + ' ranplase ' + esc(nomAgent(r.titulaire)) + '</div><div class="sub">' + dmy(r.du) + ' → ' + dmy(r.au) + (r.client_id ? ' · 1 kliyan' : ' · tout kliyan') + (r.motif ? ' · ' + esc(r.motif) : '') + (r._local ? ' · ap tann' : '') + '</div></div>'

function openOp(y, type){
  const c = clientOfCycle(y);
  const resteDeb = Math.max(0, +y.fonds_debloques - +y.fonds_decaisse);
  const def = type === "Paiement frais" ? (+y.frais_en_retard > 0 ? y.frais_en_retard : y.frais_journalier)
    : type === "Restitution du fonds" ? y.fonds_a_restituer
    : type === "Déblocage du fonds" ? resteDeb : "";
  const hint = type === "Paiement frais" ? (+y.frais_en_retard > 0 ? "Gen " + htg(y.frais_en_retard) + " an reta · " + htg(y.frais_journalier) + " pa jou" : htg(y.frais_journalier) + " pa jou")
    : type === "Restitution du fonds" ? "Rete " + htg(y.fonds_a_restituer) + " pou remèt"
    : type === "Déblocage du fonds" ? "Rete " + htg(resteDeb) + " pou debloke" : "Penalite pou reta";
  const OPS = [["Paiement frais", "Frè"], ["Restitution du fonds", "Remèt"], ["Déblocage du fonds", "Debloke"], ["Pénalité", "Penalite"]];
  let gps = null, mode = "Espèces";
  sheet('<div class="row">' + (c ? avatar(c) : '') + '<div class="grow"><div class="name" style="font-size:18px">' + esc(c ? c.prenom + " " + c.nom : "") + '</div>'
    + '<div class="sub">' + esc(y.numero) + ' · ' + htg(y.frais_journalier) + '/jou · Jou ' + (y.jours_consommes || 0) + '/' + y.nb_jours_prevu + '</div></div></div>'
    + '<div class="seg" role="tablist">' + OPS.map(([v, l]) => '<button type="button" role="tab" data-sw="' + v + '" class="' + (v === type ? "on" : "") + '" aria-selected="' + (v === type) + '">' + l + '</button>').join("") + '</div>'
    + '<div class="amt"><label for="opM">' + esc(type) + '</label><div class="amt-row"><input id="opM" type="text" inputmode="none" autocomplete="off" size="6" value="' + (def ? Math.round(def) : "") + '"><span>HTG</span></div><div class="hint">' + esc(hint) + '</div></div>'
    + (type === "Paiement frais" ? '<div class="chips c">' + [1,2,3].map(n => '<button class="chip" data-n="' + n + '" type="button">' + n + ' jou</button>').join("") + '</div>' : '')
    + '<div class="pad">' + ["1","2","3","4","5","6","7","8","9","000","0","del"].map(k => '<button type="button" data-k="' + k + '"' + (k === "del" ? ' aria-label="Efase"' : '') + '>'
        + (k === "del" ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 5M12 9l5 5"/></svg>' : k) + '</button>').join("") + '</div>'
    + '<div id="opG">' + gpsHtml(null) + '</div>'
    + '<div class="mode-auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg>Peman an kach (Espèces)</div>'
    + '<details class="more"><summary>Kòmantè</summary>'
    + '<label for="opC">Kòmantè</label><input id="opC" type="text" autocomplete="off"></details>'
    + '<button class="btn cta" id="opOk" type="button">Anrejistre</button><button class="btn ghost" id="opNo" type="button">Anile</button>');
  const inp = $("#opM");
  const upd = () => { inp.style.width = (Math.max(1, inp.value.length) * 0.62 + 0.1) + "em"; const v = Math.round(Number(inp.value.replace(/\D/g, ""))) || 0; $("#opOk").textContent = v > 0 ? "Anrejistre " + htg(v) : "Anrejistre"; };
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 9); upd(); };
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k; let v = inp.value;
    v = k === "del" ? v.slice(0, -1) : (v === "0" ? "" : v) + k;
    inp.value = v.replace(/^0+(?=\d)/, "").slice(0, 9); upd();
  });
  document.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => { if (b.dataset.sw !== type) openOp(y, b.dataset.sw); });
  upd();
  if (matchMedia("(hover:hover) and (pointer:fine)").matches) { inp.focus(); inp.select(); }
  getGPS(15000).then(g => { gps = g; const b = $("#opG"); if (b) b.innerHTML = gpsHtml(g); });
  document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { $("#opM").value = b.dataset.n * y.frais_journalier; upd(); });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll("[data-m]").forEach(x => x.classList.toggle("sel", x === b)); });
  $("#opNo").onclick = closeSheet;
  $("#opOk").onclick = async () => {
    const m = Math.round(Number(String($("#opM").value).replace(/\D/g, "")));
    if (!(m > 0)) return toast("Mete yon montan.", true);
    if (type === "Déblocage du fonds" && m > +y.fonds_debloques - +y.fonds_decaisse) return toast("Montan an depase sa ki rete pou debloke (" + htg(+y.fonds_debloques - +y.fonds_decaisse) + ").", true);
    if (type === "Restitution du fonds" && m > +y.fonds_a_restituer) { if (!await ask("Montan an plis pase sa kliyan an dwe remèt (" + htg(y.fonds_a_restituer) + "). Kontinye?")) return; }
    if (!await ask({ icon: type === "Déblocage du fonds" ? "out" : "in", title: type, big: htg(m), rows: [["Kliyan", c ? c.prenom + " " + c.nom : "—"], ["Cycle", y.numero], ["Mòd peman", mode]], ok: "Wi, anrejistre" })) return;
    $("#opOk").disabled = true;
    const ok = gps && !gps.err && gps.acc <= 500;
    const t = { id: uuid(), cycle_id: y.id, type, montant: m, date_operation: today(), mode_paiement: mode,
      reference: null, commentaire: $("#opC").value.trim() || null, agent_id: S.moi.user_id,
      gps_lat: ok ? gps.lat : null, gps_lng: ok ? gps.lng : null, gps_precision_m: ok ? gps.acc : null,
      capture_le: new Date().toISOString(), appareil: (navigator.userAgent || "").slice(0, 120) };
    await enqueue("tx", t, type + " " + htg(m) + " · " + (c ? c.prenom + " " + c.nom : ""));
    S.tx.unshift({ ...t, _local: true }); applyTxLocal(t); save("tx"); save("cycles");
    closeSheet(); toast(type + " anrejistre ✔" + (S.online ? "" : " (ap voye lè entènèt tounen)")); render();
  };
}

function renderNouvo(m){

    + '<div id="nG"></div>'

    + '<label for="nNo">Nòt</label><textarea id="nNo" rows="2"></textarea>'

    const q = tel || (nm.replace(/[^a-zA-ZÀ-ÿ]/g, "").length >= 4 ? nm : "");
    const box = $("#nSug"); if (!box) return;
    if (!q || !S.online) { box.innerHTML = ""; sugKey = ""; return; }

      const res = (await rpc("debloke_rechercher", { p_q: q })).filter(r => tel ? normTel(r.telephone) === tel || r.score >= 0.99 : r.score >= 0.45).slice(0, 5);
      if (!$("#nSug") || sugKey !== q) return;
      box.innerHTML = res.length ? '<div class="warnbox"><b>Moun sa a ka deja nan baz la.</b> Si se youn ladan yo, chwazi l olye w kreye yon nouvo kliyan :</div>' + res.map(resultCard).join("") : "";
      box.querySelectorAll("[data-pers]").forEach(el => el.onclick = () => { const r = res.find(z => z.id_personne === el.dataset.pers); if (r) openResult(r); });
      hydrate(box);

  }, 600); };

/* ================= RAPÒ JOUNEN AN ================= */
const RAPO_TYPES = ["Paiement frais", "Pénalité", "Restitution du fonds", "Déblocage du fonds"];
function rapoCalc(date, ag){
  const parAg = x => !ag || x.agent_id === ag;
  const tx = S.tx.filter(t => t.date_operation === date && parAg(t));
  const z = () => ({ esp: 0, aut: 0, n: 0 });
  const r = {}; RAPO_TYPES.forEach(k => r[k] = z());
  tx.forEach(t => {
    const cat = RAPO_TYPES.includes(t.type) ? t.type : t.affectation; if (!r[cat]) return;
    const m = Number(t.montant) * (t.type === "Ajustement" || t.type === "Annulation" ? (Number(t.sens) || -1) : 1);
    if ((t.mode_paiement || "Espèces") === "Espèces") r[cat].esp += m; else r[cat].aut += m;
    if (RAPO_TYPES.includes(t.type)) r[cat].n++;
  });
  const av = S.avances.filter(a => a.date_jour === date && parAg(a) && a.statut !== "Annulé");
  const avOk = av.filter(a => a.statut === "Confirmé").reduce((s, a) => s + Number(a.montant), 0);
  const avAt = av.filter(a => a.statut !== "Confirmé").reduce((s, a) => s + Number(a.montant), 0);
  const fre = r["Paiement frais"], pen = r["Pénalité"], rem = r["Restitution du fonds"], deb = r["Déblocage du fonds"];
  const kes = avOk + fre.esp + pen.esp + rem.esp - deb.esp;
  const lotMod = fre.aut + pen.aut + rem.aut - deb.aut;
  return { tx, av, avOk, avAt, fre, pen, rem, deb, kes, lotMod };
}
const RIC = {
  av: '<path d="M3 7h18v10H3z"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/>',
  fre: '<path d="M12 3v18M16 7.5c0-1.7-1.8-3-4-3s-4 1.3-4 3 1.8 2.6 4 3 4 1.3 4 3-1.8 3-4 3-4-1.3-4-3"/>',
  rem: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  pen: '<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/>',
  deb: '<path d="M15 10l5 5-5 5"/><path d="M20 15H9a5 5 0 0 1 0-10h3"/>'
};
const ric = k => '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + RIC[k] + '</svg></span>';
const AV_TAG = { "En attente": '<span class="tag warn">Ap tann ajan an</span>', "Confirmé": '<span class="tag ok">Konfime</span>', "Contesté": '<span class="tag err">Ajan an di l pa bon</span>' };

function renderRapo(m){

  const mgr = isMgr(), ag = mgr ? S.rAg : (S.moi && S.moi.user_id);
  const d = S.rDate, r = rapoCalc(d, ag);
  const nomAg = ag ? (mgr ? nomAgent(ag) : (S.moi && S.moi.nom)) : "Tout ekip la";

  // 2-4. Frè, Remèt, Debloke

  html += '<div class="rsumm" id="rSum"><div class="lbl">Kòb pou depoze nan kès · ' + esc(nomAg) + '</div>'
    + '<div class="ln" style="margin-top:10px"><span>Fon finans bay (konfime)</span><b>+ ' + htg(r.avOk) + '</b></div>'

    + (r.kes < 0 ? '<div class="nt"><b>Atansyon :</b> ajan an debloke plis kòb pase sa li te genyen. Verifye fon finans lan.</div>' : '')
    + (r.avAt ? '<div class="nt">' + htg(r.avAt) + ' fon finans pa konte paske ajan an poko konfime l.</div>' : '')
    + (r.lotMod ? '<div class="nt">' + htg(r.lotMod) + ' te pase pa MonCash / NatCash / bank : yo pa nan kès la.</div>' : '')

/* Kòd kliyan kreye sou telefòn nan (menm fòma ak Bwat Sekrem : LM-Q47RX) pou l parèt menm san entènèt */
function genCodeClient(p, n){
  const ini = s => (String(s || "").normalize("NFD").replace(/[^A-Za-z]/g, "")[0] || "X").toUpperCase();
  const A = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ", used = new Set(S.clients.map(c => c.code_client));
  for (let t = 0; t < 20; t++) {
    const r = new Uint8Array(5); crypto.getRandomValues(r);
    const k = ini(p) + ini(n) + "-" + Array.from(r, x => A[x % 36]).join("");
    if (!used.has(k)) return k;
  }
  return null;
}

function ask(o){

      + (o.input ? '<input id="askIn" type="' + (o.input.type || "text") + '"' + (o.input.type === "number" ? ' inputmode="numeric"' : '') + ' value="' + esc(o.input.value ?? "") + '" placeholder="' + esc(o.input.placeholder || "") + '" autocomplete="off">' : '')
      + '<div class="ask-b' + (o.cancel === false ? ' one' : '') + '">' + (o.cancel === false ? '' : '<button class="btn ghost" id="askNo" type="button">' + esc(o.cancel || "Anile") + '</button>') + '<button class="btn" id="askOk" type="button">' + esc(o.ok || "Wi, konfime") + '</button></div></div>';
    el.classList.remove("hidden");
    requestAnimationFrame(() => el.classList.add("on"));
    const inp = $("#askIn");
    const done = v => { document.removeEventListener("keydown", kd, true); el.classList.remove("on"); el.classList.add("hidden"); el.innerHTML = ""; try { prev && prev.focus && prev.focus(); } catch (e) {} res(v); };
    const okv = () => done(o.input ? inp.value : true), nov = () => done(o.input ? null : false);
    const kd = e => { if (e.key === "Escape") { e.preventDefault(); nov(); } else if (e.key === "Enter" && (!o.input || document.activeElement === inp)) { e.preventDefault(); okv(); } };
    document.addEventListener("keydown", kd, true);
    $("#askOk").onclick = okv; if ($("#askNo")) $("#askNo").onclick = nov;
    el.onclick = e => { if (e.target === el) nov(); };
    (inp || $("#askOk")).focus();
  });
}

/* ================= POZISYON AN DIRÈK + SWIVI PAKOU ================= */
S.pos = null; let watchId = null, lastRec = null;
const TRACK = () => !!S.moi && S.moi.role === "agent";            // se sèlman ajan yo ki swiv
const inHaiti = g => g.lat >= 17.5 && g.lat <= 20.5 && g.lng >= -75 && g.lng <= -71.5;
function startWatch(){
  if (!navigator.geolocation || watchId !== null || !S.session) return;
  watchId = navigator.geolocation.watchPosition(p => onPos(posOf(p)), () => { S.posErr = true; renderNet(); },
    { enableHighAccuracy: true, maximumAge: 20000, timeout: 60000 });
  renderNet();
}
function stopWatch(){ if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } renderNet(); }
const posOf = p => ({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), spd: p.coords.speed, at: new Date(p.timestamp || Date.now()).toISOString() });
let posQ = Promise.resolve();
function onPos(g){
  S.pos = g; S.posErr = false;
  updateDistances(); if (S.map) katMe();
  if (!TRACK() || g.acc > 100 || !inHaiti(g)) return;
  const now = Date.parse(g.at);
  if (lastRec && distM(lastRec, g) < 30 && now - Date.parse(lastRec.at) < 55000) return;   // yon pwen chak minit oswa chak 30 m
  lastRec = g;
  posQ = posQ.then(async () => {
    const q = (await DB.get("kv", "posQueue")) || [];
    q.push({ id: uuid(), agent_id: S.moi.user_id, lat: g.lat, lng: g.lng, precision_m: g.acc, vitesse_ms: g.spd ?? null, capture_le: g.at });
    if (q.length > 6000) q.splice(0, q.length - 6000);
    await DB.set("kv", "posQueue", q);
  }).catch(() => {});
}
// Lè ajan an pa deplase, telefòn nan pa voye nouvo pozisyon : mande youn chak minit
setInterval(() => { if (watchId !== null && document.visibilityState === "visible" && TRACK())
  navigator.geolocation.getCurrentPosition(p => onPos(posOf(p)), () => {
    // Telefòn nan pa bay nouvo pozisyon paske l pa deplase : ajan an toujou nan menm kote a
    if (S.pos && Date.now() - Date.parse(S.pos.at) < 300000) onPos({ ...S.pos, at: new Date().toISOString() });
  }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 }); }, 60000);

async function pushPositions(){
  await posQ;
  let q = ((await DB.get("kv", "posQueue")) || []).filter(p => S.moi && p.agent_id === S.moi.user_id);
  while (q.length) {
    const b = q.slice(0, 300);
    try { await http("/rest/v1/debloke_positions?on_conflict=id", { method: "POST", body: b, headers: { Prefer: "resolution=ignore-duplicates,return=minimal" } }); }
    catch (e) { if (e.status === 0 || e.code === "relogin") throw e; }      // lòt erè : pa bloke fil la
    const ids = new Set(b.map(x => x.id)), cur = (await DB.get("kv", "posQueue")) || [];
    await DB.set("kv", "posQueue", cur.filter(x => !ids.has(x.id)));
    q = q.slice(300);
  }
}

/* Distans ak tan pou rive bò kliyan an (estimasyon : wout ≈ 1,3 × liy dwat) */
const ROAD = 1.3, V_PYE = 4.5, V_MOTO = 20;
const fmtD = d => d < 1000 ? Math.round(d / 10) * 10 + " m" : (d / 1000).toFixed(d < 10000 ? 1 : 0).replace(".", ",") + " km";
const mins = (d, v) => Math.max(1, Math.round(d / 1000 / v * 60));
function etaText(lat, lng){
  if (!S.pos || lat == null || lat === "") return "";
  const d = distM(S.pos, { lat: +lat, lng: +lng }) * ROAD;
  return "📍 " + fmtD(d) + " · 🚶 " + mins(d, V_PYE) + " min · 🛵 " + mins(d, V_MOTO) + " min";
}

/* Pakou optimize : vwazen ki pi pre + amelyorasyon 2-opt (wout ouvè, pa retounen) */
function optimize(start, pts){
  const s = start ? [start] : [], rest = pts.slice();
  let cur = start || rest.shift(); if (!start) s.push(cur);
  while (rest.length) { let bi = 0, bd = Infinity; rest.forEach((p, i) => { const d = distM(cur, p); if (d < bd) { bd = d; bi = i; } }); cur = rest.splice(bi, 1)[0]; s.push(cur); }
  const D = (a, b) => (a && b ? distM(a, b) : 0);
  for (let it = 0, imp = true; imp && it < 60; it++) {
    imp = false;
    for (let i = 1; i < s.length - 1; i++) for (let j = i + 1; j < s.length; j++) {
      const delta = D(s[i - 1], s[j]) + D(s[i], s[j + 1]) - D(s[i - 1], s[i]) - D(s[j], s[j + 1]);
      if (delta < -1) { s.splice(i, j - i + 1, ...s.slice(i, j + 1).reverse()); imp = true; }
    }
  }
  return start ? s.slice(1) : s;
}
function katOptim(list, bounds){

      + '<div class="grow"><div class="name" style="font-size:15px">' + esc(p.c.prenom + " " + p.c.nom) + '</div><div class="sub">' + (i || start ? "+" + fmtD(leg) + " · 🛵 " + mins(leg, V_MOTO) + " min" : "Premye kliyan") + '</div></div>'
      + '<div class="sub" style="text-align:right">🛵 ' + mins(cum, V_MOTO) + ' min<br>🚶 ' + mins(cum, V_PYE) + ' min</div></div></div></div>');

/* Pakou yon ajan pou yon jou : wout, kanpe, tan bò chak kliyan */
function detectStops(pts, rad = 40, minMs = 180000){
  const out = []; let i = 0;
  while (i < pts.length) {
    let j = i + 1; const a = pts[i];
    while (j < pts.length && distM(a, pts[j]) <= rad) j++;
    const d = Date.parse(pts[j - 1].capture_le) - Date.parse(a.capture_le);
    if (j - 1 > i && d >= minMs) {
      const sub = pts.slice(i, j);
      out.push({ lat: sub.reduce((s, p) => s + p.lat, 0) / sub.length, lng: sub.reduce((s, p) => s + p.lng, 0) / sub.length, from: a.capture_le, to: pts[j - 1].capture_le, dur: d });
      i = j;
    } else i++;
  }
  return out;
}

        + (s.txs.length ? ' · ' + s.txs.map(t => (TX_ICO[t.type] || "") + " " + htg(t.montant)).join(", ") : ' · pa gen operasyon') + '</div></div><span class="tag ok">⏱ ' + dur(s.dur) + '</span></div></div></div>'
      : '<div class="it" style="--c:#7A6A6C"><div class="sub" style="padding:6px 0">⏸ Kanpe ' + dur(s.dur) + ' (' + hhmm(s.from) + ' → ' + hhmm(s.to) + '), pa toupre okenn kliyan</div></div>' }))
    .concat(gaps.map(g => ({ t: g.from, h: '<div class="it" style="--c:#B26A00"><div class="sub" style="padding:6px 0;color:var(--warn)">⚠️ Pa gen pozisyon ' + hhmm(g.from) + ' → ' + hhmm(g.to) + ' (' + dur(g.g) + ') : app la te fèmen oswa pa t gen siyal GPS</div></div>' })))
    .sort((x, y) => String(x.t).localeCompare(String(y.t)));
  panel.innerHTML = '<div class="kpis"><div class="kpi"><b>' + hhmm(a.capture_le) + '</b><span>Kòmanse</span></div><div class="kpi"><b>' + hhmm(z.capture_le) + '</b><span>Dènye pozisyon</span></div><div class="kpi"><b>' + fmtD(km) + '</b><span>Distans pakouri</span></div>'
    + '<div class="kpi"><b>' + visits.length + '</b><span>Vizit kliyan</span></div><div class="kpi"><b>' + dur(tVis) + '</b><span>Tan bò kliyan</span></div><div class="kpi"><b>' + dur(Date.parse(z.capture_le) - Date.parse(a.capture_le)) + '</b><span>Tan sou teren</span></div></div>'
    + '<div class="sub" style="margin:8px 2px">Yon vizit = ajan an rete omwen 3 min nan menm kote a (± 40 m), a mwens pase 80 m de yon kliyan.</div>'
    + '<h3>Jounen ' + esc(nomAgent(k.agent)) + '</h3>' + (events.length ? '<div class="tl">' + events.map(e => e.h).join("") + '</div>' : '<div class="sub">Pa gen kanpe detekte.</div>');
  hydrate(panel);
}

/* ================= DEMARAJ ================= */
function showLogin(relog){
  $("#vApp").classList.add("hidden"); $("#vLogin").classList.remove("hidden"); wireLang($("#vLogin"));
  if (relog && S.moi) $("#lTel").value = S.moi.telephone || "";
}
async function showApp(){
  $("#vLogin").classList.add("hidden"); $("#vApp").classList.remove("hidden");
  renderNet(); renderBadge(); render(); startWatch();
}
$("#lBtn").onclick = async () => {
  const tel = normTel($("#lTel").value), pwd = $("#lPwd").value;
  $("#lErr").textContent = "";
  if (!tel) return $("#lErr").textContent = "Nimewo telefòn nan pa bon.";
  if (!pwd) return $("#lErr").textContent = "Mete modpas ou.";
  if (!navigator.onLine) return $("#lErr").textContent = "Premye koneksyon an bezwen entènèt.";
  $("#lBtn").disabled = true; $("#lBtn").textContent = "Ap konekte…";
  try {
    await login(tel, pwd);
    const prev = S.moi && S.moi.user_id;
    if (prev && prev !== S.session.user_id) {   // lòt ajan sou menm telefòn : efase done ansyen an (outbox li rete)
      for (const k of ["clients","comptes","cycles","tx"]) { S[k] = []; await DB.del("kv", k); }
    }
    S.moi = { user_id: S.session.user_id, telephone: tel, nom: "", role: "" };
    try { await rpc("debloke_appareil_connecter", { p_device: await deviceId(), p_info: deviceInfo(), p_en_attente: await pendingMine() }); }
    catch (e) {
      const o = apareyOkipe(e);
      if (o) {
        S.session = null; await DB.del("kv", "session");
        await ask({ icon: "warn", tone: "danger", title: "Kont ou louvri sou yon lòt telefòn", big: o.n + " operasyon",
          rows: [["Telefòn", o.info], ["Dènye fwa", o.dat]],
          msg: "Lòt telefòn nan gen done ki poko voye. Louvri app la sou telefòn sa a ak entènèt pou l voye yo, epi dekonekte l. Si telefòn nan pèdi oswa kase, mande manager a dekonekte l.", ok: "OK", cancel: false });
        throw new Error("Kont lan deja louvri sou yon lòt telefòn.");
      }
      if (e.status === 0 || !/function|404|PGRST/i.test(e.message + e.status)) throw e;   // ansyen sèvè san fonksyon an : kontinye
    }
    await pull(); S.lastSync = new Date().toISOString(); save("lastSync");
    if (!S.moi.role) { S.session = null; await DB.del("kv", "session"); throw new Error("Kont sa a pa yon kont Debloke aktif."); }
    $("#lPwd").value = ""; S.needRelogin = false; showApp(); sync();
  } catch (e) {
    $("#lErr").textContent = /invalid/i.test(e.message) ? "Telefòn oswa modpas pa bon." : /banned/i.test(e.message) ? "Kont sa a dezaktive." : e.message;
  } finally { $("#lBtn").disabled = false; $("#lBtn").textContent = "Konekte"; }
};
$("#lPwd").addEventListener("keydown", e => { if (e.key === "Enter") $("#lBtn").click(); });

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { S.page = b.dataset.p; closeSheet(); render(); window.scrollTo(0, 0); });
$("#main").addEventListener("click", e => {
  const y = e.target.closest("[data-cycle]"); if (y) return openCycle(y.dataset.cycle);
  const c = e.target.closest("[data-client]"); if (c) return openClient(c.dataset.client);
});
$("#hNet").onclick = () => sync(true);
window.addEventListener("online", () => { S.online = true; renderNet(); sync(); });
window.addEventListener("offline", () => { S.online = false; renderNet(); });
setInterval(() => { if (S.online && S.session && document.visibilityState === "visible") sync(); }, 120000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { if (S.session && !$("#vApp").classList.contains("hidden")) startWatch(); if (S.online && S.session) sync(); }
  else stopWatch();
});

const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
(async function start(){
  if (CFG.test) $("#testBanner").classList.remove("hidden");
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // Nouvo vèsyon : montre yon bann pou rechaje (done yo pa efase)
      reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => {
        if (w.state === "activated" && hadController) $("#upd").classList.remove("hidden"); }); });
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
  }
  $("#upd").onclick = () => location.reload();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  await loadState();
  if (S.session && S.moi && S.moi.role) { showApp(); if (S.online) sync(); }
  else showLogin();
})();
</script>
