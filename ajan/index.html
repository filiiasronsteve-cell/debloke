<script>
"use strict";
/* ================= KONFIGIRASYON ================= */
const APP_VERSION = "1.8 · 04/11/2026";
const CFG = {
  url: "https://riutfmqffpffniutbhue.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdXRmbXFmZnBmZm5pdXRiaHVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NzYwMjMsImV4cCI6MjEwOTM1MjAyM30.esDd_orfWwlGtRCDz4DDKH9Pwnz6R7mVHWilqNVkn74",
  test: true,
  domen: "ajan.debloke.invalid",
  bucket: "debloke-photos",
  frais: [100,150,250,350,500,750,1000,1250],
  modes: ["Espèces","MonCash","NatCash","Virement bancaire","Autre"],
  activites: ["Restaurant","Fritay / vente de rue","Pâtisserie","Boissons / jus","Épicerie","Autre"],
  emplacements: ["Marché","Boutique","Bord de rue","Maison","Ambulant","Autre"]
};

/* ================= ZOUTI ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const htg = n => (Math.round(Number(n || 0))).toLocaleString("fr-HT").replace(/ | /g, " ") + " HTG";
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const dmy = s => s ? s.slice(8,10) + "/" + s.slice(5,7) + "/" + s.slice(0,4) : "";
const hm = s => { try { const d = new Date(s); return d.toLocaleDateString("fr-HT") + " " + d.toLocaleTimeString("fr-HT",{hour:"2-digit",minute:"2-digit"}); } catch { return s; } };
function normTel(t){ let d = String(t||"").replace(/\D/g,""); if (d.length === 8) d = "509" + d; return /^509\d{8}$/.test(d) ? d : null; }
function toast(msg, err){ const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), err ? 5000 : 2600); }

/* ================= STOKAJ LOKAL (IndexedDB) ================= */
const DB = {
  _db: null,
  open(){ return this._db || (this._db = new Promise((ok, ko) => {
    const r = indexedDB.open("debloke-ajan", 1);
    r.onupgradeneeded = () => { const d = r.result;
      d.createObjectStore("kv"); d.createObjectStore("outbox", { keyPath: "seq", autoIncrement: true }); d.createObjectStore("photos"); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  })); },
  async tx(store, mode, fn){ const d = await this.open(); return new Promise((ok, ko) => {
    const t = d.transaction(store, mode), s = t.objectStore(store); let res;
    Promise.resolve(fn(s)).then(v => res = v);
    t.oncomplete = () => ok(res); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); }); },
  req(r){ return new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  get(store, k){ return this.tx(store, "readonly", s => this.req(s.get(k))); },
  set(store, k, v){ return this.tx(store, "readwrite", s => k === undefined ? this.req(s.put(v)) : this.req(s.put(v, k))); },
  del(store, k){ return this.tx(store, "readwrite", s => this.req(s.delete(k))); },
  all(store){ return this.tx(store, "readonly", s => this.req(s.getAll())); },
  clear(store){ return this.tx(store, "readwrite", s => this.req(s.clear())); }
};

/* ================= ETA ================= */
const S = {
  session: null, moi: null,          // moi = {user_id, nom, role, telephone}
  clients: [], comptes: [], cycles: [], tx: [], baremes: [], equipe: [], remplacements: [], filtreAgent: "",
  outbox: [], lastSync: null, online: navigator.onLine, syncing: false, page: "jodi", q: ""
};
async function loadState(){
  for (const k of ["session","moi","clients","comptes","cycles","tx","baremes","lastSync","equipe","remplacements"]) {
    const v = await DB.get("kv", k); if (v !== undefined) S[k] = v;
  }
  S.outbox = await DB.all("outbox");
}
const save = k => DB.set("kv", k, S[k]);

/* ================= API SUPABASE ================= */
class ApiErr extends Error { constructor(msg, status, code){ super(msg); this.status = status; this.code = code; } }
async function http(path, { method = "GET", body, headers = {}, auth = true, raw = false } = {}){
  const h = { apikey: CFG.key, ...headers };
  if (auth) { await ensureToken(); h.Authorization = "Bearer " + S.session.access_token; }
  if (body !== undefined && !(body instanceof Blob)) { h["Content-Type"] = "application/json"; body = JSON.stringify(body); }
  let r;
  try { r = await fetch(CFG.url + path, { method, headers: h, body }); }
  catch (e) { throw new ApiErr("Pa gen koneksyon", 0, "network"); }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok) {
    const msg = (j && (j.message || j.msg || j.error_description || j.erè || j.error)) || ("Erè " + r.status);
    throw new ApiErr(msg, r.status, j && (j.code || j.error_code));
  }
  return raw ? txt : j;
}
async function login(tel, pwd){
  const j = await http("/auth/v1/token?grant_type=password", { method: "POST", auth: false,
    body: { email: tel + "@" + CFG.domen, password: pwd } });
  setSession(j);
}
function setSession(j){
  S.session = { access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in || 3600)), user_id: j.user && j.user.id };
  save("session");
}
async function ensureToken(){
  if (!S.session) throw new ApiErr("Ou pa konekte", 401, "no_session");
  if (S.session.expires_at - 60 > Date.now()/1000) return;
  try {
    const j = await http("/auth/v1/token?grant_type=refresh_token", { method: "POST", auth: false, body: { refresh_token: S.session.refresh_token } });
    setSession(j);
  } catch (e) {
    if (e.status === 0) throw e;
    S.needRelogin = true; throw new ApiErr("Sesyon an fini. Konekte ankò (done ki pa voye yo ap rete).", 401, "relogin");
  }
}
const rpc = (fn, args) => http("/rest/v1/rpc/" + fn, { method: "POST", body: args || {} });
const sel = (t, q) => http("/rest/v1/" + t + "?" + q);
const ins = (t, row) => http("/rest/v1/" + t, { method: "POST", body: row, headers: { Prefer: "return=minimal" } });
const patch = (t, q, row) => http("/rest/v1/" + t + "?" + q, { method: "PATCH", body: row, headers: { Prefer: "return=minimal" } });
const kontFn = body => http("/functions/v1/debloke-kont", { method: "POST", body });
const isMgr = () => !!S.moi && ["manager","responsable","admin"].includes(S.moi.role);
const isAdm = () => !!S.moi && ["responsable","admin"].includes(S.moi.role);
const nomAgent = id => { const p = S.equipe.find(x => x.user_id === id); return p ? p.nom : (S.moi && id === S.moi.user_id ? S.moi.nom : ""); };

/* ================= GPS ================= */
function getGPS(timeout = 20000){
  // Si swivi an dirèk la fèk bay yon bon pozisyon (< 20 s), sèvi avè l : pi rapid, epi kèk telefòn bloke 2 demann GPS an menm tan
  const fresh = maxMs => S.pos && Date.now() - Date.parse(S.pos.at) < maxMs && S.pos.acc <= 200 ? { lat: S.pos.lat, lng: S.pos.lng, acc: S.pos.acc, at: S.pos.at } : null;
  const f = fresh(120000); if (f) return Promise.resolve(f);
  return new Promise(res => {
    if (!navigator.geolocation) return res({ err: "Telefòn sa a pa gen GPS." });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: new Date(p.timestamp).toISOString() }),
      e => res(e.code !== 1 && fresh(120000) || { err: e.code === 1 ? "Ou pa bay app la otorizasyon GPS. Aktive l nan paramèt telefòn nan." : "GPS la pa jwenn pozisyon. Ale deyò oswa eseye ankò." }),
      { enableHighAccuracy: true, timeout, maximumAge: 10000 });
  });
}

/* ================= FOTO ================= */
function compressImage(file, max = 1280, q = 0.72){
  return new Promise((ok, ko) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : ko(new Error("foto")), "image/jpeg", q); };
    img.onerror = () => { URL.revokeObjectURL(u); ko(new Error("Foto a pa ka li.")); };
    img.src = u;
  });
}

/* Afichaj foto : "local:<id>" (poko voye), "dbk:<chemen>" (depo prive Debloke), oswa yon lyen https */
const PH = new Map();
const photoRef = c => c._photo ? "local:" + c._photo : c.photo_path ? "dbk:" + c.photo_path : c.photo_bs || c.photo || null;
const initials = c => (((c.prenom || "?")[0] || "") + ((c.nom || "")[0] || "")).toUpperCase();
function avatar(c, big){
  const ref = photoRef(c), cl = "av" + (big ? " big" : "");
  return ref ? '<img class="' + cl + '" data-ph="' + esc(ref) + '" alt="Foto ' + esc(c.prenom || "") + '">' : '<span class="' + cl + '">' + esc(initials(c)) + '</span>';
}
async function photoUrl(ref){
  if (PH.has(ref)) return PH.get(ref);
  let url = null, b = null;
  if (/^https?:\/\//.test(ref)) url = ref;
  else if (ref.startsWith("local:")) b = await DB.get("photos", ref.slice(6));
  else if (ref.startsWith("dbk:")) {
    const path = ref.slice(4);
    b = await DB.get("photos", "p:" + path);
    if (!b && S.online && S.session) {
      try { await ensureToken();
        const r = await fetch(CFG.url + "/storage/v1/object/authenticated/" + CFG.bucket + "/" + path, { headers: { apikey: CFG.key, Authorization: "Bearer " + S.session.access_token } });
        if (r.ok) { b = await r.blob(); DB.set("photos", "p:" + path, b); } } catch {}
    }
  }
  if (b) url = URL.createObjectURL(b);
  if (url) PH.set(ref, url);
  return url;
}

/* Distans an mèt ant 2 pwen GPS */
function distM(a, b){ const R = 6371000, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa/2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo/2) ** 2; return Math.round(2 * R * Math.asin(Math.sqrt(h))); }

/* ================= OUTBOX (operasyon k ap tann) ================= */
async function enqueue(kind, payload, label){
  const item = { kind, payload, label, created: new Date().toISOString(), status: "pending", error: null, user_id: S.moi && S.moi.user_id };
  item.seq = await DB.set("outbox", undefined, item);
  S.outbox.push(item); renderBadge();
  if (S.online) sync();
  return item;
}

async function pushOne(it){
  const p = it.payload;
  switch (it.kind) {
    case "photo": {
      const blob = await DB.get("photos", p.key);
      if (blob) {
        try { await http("/storage/v1/object/" + CFG.bucket + "/" + p.path, { method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" } }); }
        catch (e) { if (!(e.status === 409 || /exists|duplicate/i.test(e.message))) throw e; }   // deja voye
        await DB.set("photos", "p:" + p.path, blob);   // kenbe l sou telefòn nan pou l parèt san entènèt
        await DB.del("photos", p.key);
      }
      return;
    }
    case "inscrire": return rpc("debloke_inscrire_client", p);
    case "ouvrir": {
      const r = await rpc("debloke_ouvrir_compte", p);
      const k = S.comptes.find(x => x.id === p.p_id); if (k && r && r.numero) { k.numero = r.numero; k._local = false; save("comptes"); }
      return r;
    }
    case "gps": return rpc("debloke_enregistrer_gps_commerce", p);
    case "tx":
      try { return await ins("debloke_transactions", p); }
      catch (e) { if (e.code === "23505") return; throw e; }      // deja voye
    case "off":
      try { return await ins("debloke_jours_off", p); }
      catch (e) { if (e.code === "23505") return; throw e; }
    case "cycle":
      try { return await ins("debloke_cycles", p); }
      catch (e) { if (e.code === "23505") return; throw e; }
    case "cloture": return rpc("debloke_cloturer_cycle", p);
    case "remplacement":
      try { return await ins("debloke_remplacements", p); }
      catch (e) { if (e.code === "23505") return; throw e; }
    case "annule_rp": return patch("debloke_remplacements", "id=eq." + p.id, { annule: true });
    case "transfert": return rpc("debloke_transferer_client", p);
  }
}

async function sync(manual){
  if (S.syncing) return;
  if (!S.online) { if (manual) toast("Pa gen entènèt. Done yo ap voye lè entènèt tounen.", true); return; }
  S.syncing = true; renderNet();
  let ok = 0, fail = 0;
  try {
    const items = (await DB.all("outbox")).filter(i => i.status !== "done");
    for (const it of items) {
      if (it.user_id && S.moi && it.user_id !== S.moi.user_id) continue;   // pa voye done yon lòt ajan
      try { await pushOne(it); await DB.del("outbox", it.seq); ok++; }
      catch (e) {
        if (e.status === 0) throw e;                                    // koneksyon koupe : kanpe
        if (e.code === "relogin") throw e;
        it.status = "error"; it.error = e.message; it.tries = (it.tries || 0) + 1; await DB.set("outbox", undefined, it); fail++;
      }
    }
    await pushPositions();
    await pull();
    S.lastSync = new Date().toISOString(); save("lastSync");
    if (manual || ok || fail) toast(fail ? (fail + " operasyon pa pase. Gade nan Senk.") : (ok ? ok + " operasyon voye ✔" : "Tout bagay ajou ✔"), !!fail);
  } catch (e) {
    if (e.code === "relogin") { toast(e.message, true); showLogin(true); }
    else if (manual) toast(e.message, true);
  } finally {
    S.outbox = await DB.all("outbox"); S.syncing = false; renderNet(); renderBadge(); render();
  }
}

async function pull(){
  const [moi, clients, comptes, cycles, baremes] = await Promise.all([
    sel("debloke_personnel", "select=user_id,nom,role,telephone&user_id=eq." + S.session.user_id),
    sel("debloke_v_clients", "select=*&order=nom.asc"),
    sel("debloke_comptes", "select=id,numero,client_id,statut,limite_autorisee,date_ouverture&order=date_ouverture.desc"),
    sel("debloke_v_cycles", "select=*&statut=not.in.(Annulé)&order=date_debut.desc&limit=500"),
    sel("debloke_baremes_frais", "select=frais_journalier&actif=eq.true&order=frais_journalier.asc")
  ]);
  const ids = cycles.filter(c => !/Terminé/.test(c.statut) || c.date_debut >= addDays(today(), -30)).map(c => c.id);
  let tx = [];
  if (ids.length) tx = await sel("debloke_transactions", "select=id,cycle_id,type,montant,sens,affectation,date_operation,mode_paiement,capture_le,agent_id&order=capture_le.desc&limit=1000&cycle_id=in.(" + ids.join(",") + ")");
  if (moi[0]) { S.moi = moi[0]; save("moi"); }
  if (isMgr()) {
    const [eq, rp] = await Promise.all([
      sel("debloke_personnel", "select=user_id,nom,role,telephone,actif&order=nom.asc"),
      sel("debloke_remplacements", "select=*&annule=eq.false&au=gte." + addDays(today(), -1) + "&order=du.asc")
    ]);
    S.equipe = eq; S.remplacements = rp; save("equipe"); save("remplacements");
  }
  // Kenbe done lokal ki poko pase
  const pend = await DB.all("outbox");
  const pendClients = new Set(pend.filter(i => i.kind === "inscrire").map(i => i.payload.p_id));
  const pendComptes = new Set(pend.filter(i => i.kind === "ouvrir").map(i => i.payload.p_id));
  const pendCycles = new Set(pend.filter(i => i.kind === "cycle").map(i => i.payload.id));
  const pendClot = new Map(pend.filter(i => i.kind === "cloture").map(i => [i.payload.p_cycle, i.payload.p_date_fin]));
  const pendTx = new Set(pend.filter(i => i.kind === "tx").map(i => i.payload.id));
  S.clients = clients.concat(S.clients.filter(c => c._local && pendClients.has(c.id) && !clients.some(x => x.id === c.id)));
  S.comptes = comptes.concat(S.comptes.filter(c => c._local && pendComptes.has(c.id) && !comptes.some(x => x.id === c.id)));
  S.cycles = cycles.concat(S.cycles.filter(y => y._local && pendCycles.has(y.id) && !cycles.some(x => x.id === y.id)));
  S.cycles.forEach(y => { if (pendClot.has(y.id) && isOpen(y)) { y.statut = "Terminé"; y._closing = true; } });
  const localTx = S.tx.filter(t => t._local && pendTx.has(t.id) && !tx.some(x => x.id === t.id));
  S.tx = tx.concat(localTx);
  localTx.forEach(applyTxLocal);
  S.baremes = baremes.map(b => Number(b.frais_journalier));
  for (const k of ["clients","comptes","cycles","tx","baremes"]) await save(k);
}
function addDays(s, n){ const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }

/* Kalandriye lokal (pou cycle kreye san entènèt) : menm règ ak sèvè a */
function calcLocal(y){
  const off = new Set(y.jours_repos || []), jours = [];
  for (let d = y.date_debut, i = 0; jours.length < y.nb_jours_prevu && i < 60; d = addDays(d, 1), i++) {
    const dow = new Date(d + "T12:00:00").getDay();
    if ((y.dimanches_exclus && dow === 0) || off.has(dow)) continue;
    jours.push(d);
  }
  const fin = y.date_fin_reelle && y.date_fin_reelle < today() ? y.date_fin_reelle : today();
  y.date_fin_prevue = jours[jours.length - 1]; y.date_limite = y.prolonge_jusqu_au || y.date_fin_prevue;
  y.jours_consommes = jours.filter(d => d <= fin).length;
  y.frais_dus = y.jours_consommes * y.frais_journalier; y.frais_total_prevu = y.nb_jours_prevu * y.frais_journalier;
  y.frais_en_retard = Math.max(0, y.frais_dus - (+y.frais_payes || 0));
  y.fonds_a_restituer = +y.fonds_debloques - (+y.fonds_restitue || 0);
  return y;
}

/* Mete chif cycle la ajou lokalman (san entènèt) */
function applyTxLocal(t){
  const c = S.cycles.find(x => x.id === t.cycle_id); if (!c) return;
  const m = Number(t.montant);
  if (t.type === "Paiement frais") { c.frais_payes = +c.frais_payes + m; c.frais_en_retard = Math.max(0, +c.frais_dus - c.frais_payes); }
  if (t.type === "Restitution du fonds") { c.fonds_restitue = +c.fonds_restitue + m; c.fonds_a_restituer = +c.fonds_debloques - c.fonds_restitue; }
  if (t.type === "Déblocage du fonds") { c.fonds_decaisse = +c.fonds_decaisse + m; if (c.statut === "Prévu") c.statut = "Actif"; }
  if (t.type === "Pénalité") { c.penalites_payees = +c.penalites_payees + m; }
}

  const q = S.q.trim().toLowerCase(), qd = q.replace(/\D/g, ""), near = S.near;
  let list = S.clients.filter(c => !q || (c.prenom + " " + c.nom + " " + (c.code_client || "")).toLowerCase().includes(q) || (qd.length >= 3 && String(c.telephone || "").includes(qd.slice(-8))));
  if (near) list = list.filter(c => c.gps_lat != null).map(c => (c._d = distM(near, { lat: c.gps_lat, lng: c.gps_lng }), c)).filter(c => c._d <= 1000).sort((a, b) => a._d - b._d);
  else if (S.kSort === "pre" && S.pos) list.sort((a, b) => (a.gps_lat == null) - (b.gps_lat == null) || (a.gps_lat == null ? 0 : distM(S.pos, { lat: a.gps_lat, lng: a.gps_lng }) - distM(S.pos, { lat: b.gps_lat, lng: b.gps_lng })));
  else list.sort((a, b) => (a.nom + a.prenom).localeCompare(b.nom + b.prenom));
  const g = S.glob, mineIds = new Set(S.clients.map(c => c.id));
  const others = (g.res || []).filter(r => !(r.client_id && mineIds.has(r.client_id)));
  m.innerHTML = '<div class="row" style="margin:4px 0 10px"><h2 class="grow" style="margin:0">Kliyan</h2><button class="btn" id="kNew" type="button" style="width:auto;margin:0;padding:10px 14px">➕ Nouvo kliyan</button></div>'
    + '<div class="search row"><input id="q" type="search" placeholder="🔎 Non, telefòn oswa kòd kliyan…" value="' + esc(S.q) + '">'
    + '<button class="btn ' + (near ? "" : "sec") + '" id="qNear" type="button" style="width:auto;margin:0;padding:12px 14px" title="Kliyan toupre m">📍</button></div>'
    + (near ? '<div class="sub" style="margin-top:6px">📍 Kliyan toupre w (±' + near.acc + ' m) · <b id="nearX" style="cursor:pointer;color:var(--brand)">Retire</b></div>' : '')
    + '<div class="row" style="margin-top:10px"><h3 class="grow" style="margin:0">Kliyan mwen (' + list.length + ')</h3>' + (!near ? '<div class="chips" style="margin:0"><button class="chip' + (S.kSort !== "pre" ? " sel" : "") + '" data-ks="az" type="button">A–Z</button><button class="chip' + (S.kSort === "pre" ? " sel" : "") + '" data-ks="pre" type="button">📍 Pi pre</button></div>' : '') + '</div>'
    + (list.length ? list.map(c => {
      const ys = cyclesOfClient(c.id).filter(isOpen), late = ys.some(y => +y.frais_en_retard > 0);
      return '<div class="card" data-client="' + c.id + '"><div class="row">' + avatar(c) + '<div class="grow"><div class="name">' + esc(c.prenom + " " + c.nom) + '</div>'
        + '<div class="sub">' + kodHtml(c.code_client, c.telephone, c.activite) + '</div>' + etaSpan(c) + '</div>'
        + (c._local ? '<span class="tag n">Ap tann</span>' : late ? '<span class="tag warn">Reta</span>' : ys.length ? '<span class="tag ok">Aktif</span>' : '') + '</div></div>';
    }).join("") : '<div class="sub">Okenn nan kliyan ou yo.</div>')
    + (qValid(S.q.trim()) || near ? '<h3>Nan tout baz la</h3>'
      + (!S.online ? '<div class="sub">Rechèch nan tout baz la bezwen entènèt.</div>'
        : g.loading ? '<div class="sub">Ap chèche…</div>'
        : g.err ? '<div class="err-msg">' + esc(g.err) + '</div>'
        : g.res ? (others.length ? others.map(resultCard).join("") : '<div class="sub">Pa jwenn lòt moun ki sanble.</div>') : '')
      : '<div class="sub" style="margin-top:14px">Tape omwen 3 lèt oswa yon telefòn pou chèche nan tout baz la, oswa peze 📍 pou kliyan toupre w.</div>');
  $("#kNew", m).onclick = () => { S.page = "nouvo"; render(); window.scrollTo(0, 0); };
  m.querySelectorAll("[data-ks]").forEach(b => b.onclick = () => { S.kSort = b.dataset.ks; if (S.kSort === "pre" && !S.pos) toast("Ap tann pozisyon GPS ou…"); refreshKliyan(); });
  const i = $("#q", m); i.oninput = () => { S.q = i.value; refreshKliyan(); scheduleGlobal(); };
  $("#qNear", m).onclick = async () => {
    if (S.near) { S.near = null; S.glob.key = ""; refreshKliyan(); scheduleGlobal(); return; }
    toast("Ap chèche pozisyon w…"); const gp = await getGPS(15000);
    if (gp.err) return toast(gp.err, true);
    S.near = gp; refreshKliyan(); runGlobal();
  };
  const x = $("#nearX", m); if (x) x.onclick = () => { S.near = null; S.glob.key = ""; refreshKliyan(); scheduleGlobal(); };
  m.querySelectorAll("[data-pers]").forEach(el => el.onclick = () => { const r = (S.glob.res || []).find(z => z.id_personne === el.dataset.pers); if (r) openResult(r); });
}

async function openResult(r){
  if (r.statut_debloke === "mine" && r.client_id) { if (!clientById(r.client_id) && S.online) await pull(); return openClient(r.client_id); }
  if (r.statut_debloke === "autre_agent") return toast("Kliyan sa a nan pòtfèy yon lòt ajan. Mande manager a fè yon transfè.", true);
  openChoose(r);
}

/* Ajan an chwazi yon moun ki deja nan baz la → li vin kliyan li, ak kont, epi li kreye cycle la */
function openChoose(r){
  let act = null, emp = null, gps = null;
  sheet('<div class="row">' + avatar({ prenom: r.prenom, nom: r.nom, photo: r.photo }, true) + '<div class="grow"><div class="name" style="font-size:20px">' + esc(r.prenom + " " + r.nom) + '</div>'
    + '<div class="sub">' + kodHtml(r.code_client, r.telephone) + '</div></div></div>'
    + '<div class="warnbox">Verifye se menm moun nan (foto, non, kòd, telefòn) anvan w ajoute l.</div>'
    + '<label>Aktivite</label><div class="chips">' + CFG.activites.map(a => '<button class="chip" data-ca="' + esc(a) + '" type="button">' + esc(a) + '</button>').join("") + '</div>'
    + '<label>Kote li travay</label><div class="chips">' + CFG.emplacements.map(a => '<button class="chip" data-ce="' + esc(a) + '" type="button">' + esc(a) + '</button>').join("") + '</div>'
    + '<label for="chL">Adrès / repè</label><input id="chL">'
    + '<label class="switch"><input id="chBiz" type="checkbox"><span><b>Mwen nan biznis li kounye a</b><br><span class="sub">Anrejistre pozisyon GPS biznis la.</span></span></label><div id="chG"></div>'
    + '<button class="btn" id="chOk" type="button">✔ Se li · Ajoute l epi kreye yon cycle</button><button class="btn ghost" id="chNo" type="button">Anile</button>');
  document.querySelectorAll("[data-ca]").forEach(b => b.onclick = () => { act = b.dataset.ca; document.querySelectorAll("[data-ca]").forEach(x => x.classList.toggle("sel", x === b)); });
  document.querySelectorAll("[data-ce]").forEach(b => b.onclick = () => { emp = b.dataset.ce; document.querySelectorAll("[data-ce]").forEach(x => x.classList.toggle("sel", x === b)); });
  $("#chBiz").onchange = async e => { gps = null; if (!e.target.checked) { $("#chG").innerHTML = ""; return; } $("#chG").innerHTML = gpsHtml(null); const g = await getGPS(); if ($("#chBiz") && $("#chBiz").checked) { gps = g; $("#chG").innerHTML = gpsHtml(g); } };
  $("#chNo").onclick = closeSheet;
  $("#chOk").onclick = async () => {
    if (!S.online) return toast("Fòk ou gen entènèt pou ajoute yon moun ki deja nan baz la.", true);
    const g = gps && !gps.err && gps.acc <= 200 ? gps : null;
    $("#chOk").disabled = true;
    try {
      const res = await rpc("debloke_choisir_personne", { p_id: uuid(), p_id_personne: r.id_personne, p_activite: act, p_type_emplacement: emp,
        p_localisation: ($("#chL").value || "").trim() || null, p_gps_lat: g && g.lat, p_gps_lng: g && g.lng, p_gps_precision: g && g.acc, p_capture_le: new Date().toISOString() });
      await pull(); S.glob.key = "";
      const c = clientById(res.client_id); if (!c) throw new Error("Kliyan an poko parèt. Senkronize.");
      let k = comptesOf(c.id).find(x => x.statut === "Actif");
      if (!k) {
        const kid = uuid();
        await enqueue("ouvrir", { p_id: kid, p_client: c.id, p_capture_le: new Date().toISOString() }, "Kont " + c.prenom + " " + c.nom);
        k = { id: kid, client_id: c.id, numero: "(ap tann)", statut: "Actif", _local: true }; S.comptes.push(k); save("comptes");
      }
      toast(c.prenom + " " + c.nom + " ajoute nan kliyan ou yo ✔");
      if (cyclesOfClient(c.id).some(isOpen)) openClient(c.id); else openNewCycle(c, k);
    } catch (e) { toast(e.message, true); const b = $("#chOk"); if (b) b.disabled = false; }
  };
}

function openClient(id){
  const c = clientById(id); if (!c) return;
  const ks = comptesOf(id), ys = cyclesOfClient(id), kActif = ks.find(k => k.statut === "Actif");
  const gps = c.gps_statut === "Capturé" || c._gpsPending;
  sheet('<div class="row">' + avatar(c, true) + '<div class="grow"><div class="name" style="font-size:20px">' + esc(c.prenom + " " + c.nom) + '</div>'
    + '<div class="sub">' + kodHtml(c.code_client, c.telephone) + '</div></div>'
    + (c._local ? '<span class="tag n">Ap tann entènèt</span>' : '') + '</div>'
    + '<div class="card" style="margin-top:10px"><div class="kv">'
    + '<div>Aktivite</div><div>' + esc(c.activite || "—") + '</div><div>Kote</div><div>' + esc(c.localisation || "—") + '</div>'
    + '<div>Pozisyon</div><div>' + (gps ? '<span class="tag ok">Anrejistre</span>' : '<span class="tag warn">Pou anrejistre</span>') + '</div>'
    + (isMgr() && c.agent_id ? '<div>Ajan</div><div>' + esc(nomAgent(c.agent_id)) + '</div>' : '')
    + (isMgr() && c.correspondance ? '<div>Doublon</div><div>' + ({ nouveau: "Nouvo moun", nif: "Konekte pa NIF", telephone: "Konekte pa telefòn", a_verifier: '<span class="tag err">A verifye</span> telefòn oswa NIF sa a egziste deja pou lòt moun' }[c.correspondance] || esc(c.correspondance)) + '</div>' : '') + '</div></div>'
    + (!gps ? '<button class="btn sec" id="cGps" type="button">📍 Mwen nan biznis li : anrejistre pozisyon an</button>'
      : isMgr() && !c._local ? '<button class="btn ghost" id="cGps" type="button">📍 Korije pozisyon biznis la (mwen la kounye a)</button>' : '')
    + '<h3>Kont</h3>' + (ks.length ? ks.map(k => '<div class="card"><div class="row"><div class="grow name">' + esc(k._local ? "Nouvo kont (ap tann)" : k.numero) + '</div><span class="tag ' + (k.statut === "Actif" ? "ok" : "n") + '">' + esc(k.statut) + '</span></div></div>').join("")
      : '<div class="sub">Pa gen kont.</div><button class="btn" id="cOpen" type="button">Ouvri yon kont Debloke</button>')
    + (kActif && !ys.some(isOpen) ? '<button class="btn" id="cCyc" type="button">➕ Nouvo cycle</button>' : '')
    + '<h3>Cycle</h3>' + (ys.length ? ys.map(cycleCard).join("") : '<div class="sub">Pa gen cycle.</div>'));
  const g = $("#cGps"); if (g) g.onclick = () => captureGpsFor(c);
  const o = $("#cOpen"); if (o) o.onclick = () => openCompte(c);
  const n = $("#cCyc"); if (n) n.onclick = () => openNewCycle(c, kActif);
}

async function captureGpsFor(c){
  if (c.gps_statut === "Capturé" && !confirm("Ranplase pozisyon biznis la ak kote w ye kounye a?")) return;
  const box = document.createElement("div"); box.innerHTML = gpsHtml(null); $("#cGps").replaceWith(box);
  const g = await getGPS(); box.innerHTML = gpsHtml(g);
  if (g.err || g.acc > 200) return;
  await enqueue("gps", { p_client: c.id, p_lat: g.lat, p_lng: g.lng, p_precision: g.acc, p_capture_le: g.at }, "GPS " + c.prenom + " " + c.nom);
  c._gpsPending = true; save("clients"); toast("Pozisyon anrejistre ✔"); render();
}

async function openCompte(c){
  const kid = uuid();
  const atBiz = confirm("Èske w nan biznis kliyan an kounye a?\n\nOK = wi, anrejistre pozisyon GPS la\nAnile = non, m ap anrejistre l pita");
  let g = null;
  if (atBiz && c.gps_statut !== "Capturé") { toast("Ap chèche pozisyon GPS…"); g = await getGPS(); if (g.err || g.acc > 200) { toast((g.err || "GPS pa presi ase") + " Kont lan ap ouvri san GPS.", true); g = null; } }
  await enqueue("ouvrir", { p_id: kid, p_client: c.id, p_gps_lat: g && g.lat, p_gps_lng: g && g.lng, p_gps_precision: g && g.acc, p_capture_le: (g && g.at) || new Date().toISOString() }, "Kont " + c.prenom + " " + c.nom);
  S.comptes.push({ id: kid, client_id: c.id, numero: "(ap tann)", statut: "Actif", _local: true }); save("comptes");
  if (g) { c._gpsPending = true; save("clients"); }
  toast("Kont lan anrejistre ✔"); openClient(c.id);
}

/* ---------- Operasyon sou yon cycle ---------- */
function openCycle(id){
  const y = S.cycles.find(x => x.id === id); if (!y) return;
  const c = clientOfCycle(y);
  const hist = S.tx.filter(t => t.cycle_id === id).sort((a, b) => String(b.capture_le).localeCompare(String(a.capture_le))).slice(0, 15);
  sheet('<div class="name" style="font-size:20px">' + esc(c ? c.prenom + " " + c.nom : "") + '</div><div class="sub">' + esc(y.numero) + ' · ' + esc(y.statut) + '</div>'
    + '<div class="card" style="margin-top:10px"><div class="kv">'
    + '<div>Fon debloke</div><div class="money">' + htg(y.fonds_decaisse) + ' / ' + htg(y.fonds_debloques) + '</div>'
    + '<div>Frè pa jou</div><div class="money">' + htg(y.frais_journalier) + '</div>'
    + '<div>Jou konsome</div><div>' + (y.jours_consommes || 0) + ' / ' + y.nb_jours_prevu + ' (fen ' + dmy(y.date_limite) + ')</div>'
    + '<div>Frè dwe</div><div class="money">' + htg(y.frais_dus) + '</div>'
    + '<div>Frè peye</div><div class="money">' + htg(y.frais_payes) + '</div>'
    + '<div>Frè an reta</div><div class="money" style="color:' + (+y.frais_en_retard > 0 ? "var(--err)" : "inherit") + '">' + htg(y.frais_en_retard) + '</div>'
    + '<div>Pou remèt</div><div class="money">' + htg(y.fonds_a_restituer) + '</div></div></div>'
    + (isOpen(y) ? '<div class="btns">'
      + '<button class="btn" data-op="Paiement frais" type="button">💵 Frè</button>'
      + '<button class="btn" data-op="Restitution du fonds" type="button">↩️ Remèt fon</button>'
      + '<button class="btn sec" data-op="Déblocage du fonds" type="button">💸 Debloke</button>'
      + '<button class="btn sec" data-op="Pénalité" type="button">⚠️ Penalite</button></div>'
      + '<button class="btn ghost" id="yOff" type="button">📅 Kliyan an p ap la yon jou</button>'
      + '<button class="btn ghost" id="yClose" type="button">✅ Fèmen cycle la (kliyan an fini)</button>' : '')
    + '<h3>Dènye operasyon</h3>' + (hist.length ? hist.map(t => '<div class="row sub" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="grow">' + dmy(t.date_operation) + ' · ' + esc(t.type) + (t._local ? ' · <b>ap tann</b>' : '') + '</span><span class="money">' + htg(t.montant) + '</span></div>').join("") : '<div class="sub">Okenn.</div>'));
  document.querySelectorAll("[data-op]").forEach(b => b.onclick = () => openOp(y, b.dataset.op));
  const o = $("#yOff"); if (o) o.onclick = () => openOff(y);
  const cl = $("#yClose"); if (cl) cl.onclick = () => closeCycle(y);
}

async function closeCycle(y){
  const rest = +y.fonds_a_restituer;
  if (rest > 0 && !isMgr()) return toast("Kliyan an poko remèt tout fon an (rete " + htg(rest) + "). Anrejistre remèt fon an anvan.", true);
  const c = clientOfCycle(y);
  if (!confirm("Fèmen " + (y._local ? "cycle sa a" : y.numero) + " pou " + (c ? c.prenom + " " + c.nom : "") + " jodi a?\n\nKliyan an peye sèlman jou li konsome yo (" + (y.jours_consommes || 0) + " jou · " + htg(y.frais_dus) + ")."
      + (+y.frais_en_retard > 0 ? "\n⚠️ Gen " + htg(y.frais_en_retard) + " frè ki pa peye." : "") + (rest > 0 ? "\n⚠️ Rete " + htg(rest) + " fon pou remèt." : ""))) return;
  await enqueue("cloture", { p_cycle: y.id, p_date_fin: today() }, "Fèmen cycle · " + (c ? c.prenom + " " + c.nom : ""));
  y.date_fin_reelle = today(); y.statut = rest > 0 || +y.frais_en_retard > 0 ? "Terminé avec écart" : "Terminé"; y._closing = true; save("cycles");
  closeSheet(); toast("Cycle fèmen ✔"); render();
}

/* ---------- Nouvo cycle (ajan an kreye l sou teren) ---------- */
function openNewCycle(c, k, opts = {}){
  const fr = S.baremes.length ? S.baremes : CFG.frais;
  const lim = k && k.limite_autorisee ? Number(k.limite_autorisee) : null;
  // Ranpli otomatik apati dènye cycle kont lan (kliyan an ka renouvle menm kondisyon yo)
  const prev = k ? cyclesOfCompte(k.id).slice().sort((x, y) => String(y.date_debut).localeCompare(String(x.date_debut)))[0] : null;
  let jou = prev ? +prev.nb_jours_prevu : 3, frais = prev && fr.includes(+prev.frais_journalier) ? +prev.frais_journalier : null,
      dim = prev ? prev.dimanches_exclus !== false : true, deb = true;
  const nbAv = k ? cyclesOfCompte(k.id).length : 0;
  sheet('<div class="row"><div class="name grow" style="font-size:20px">Nouvo cycle</div>' + (opts.fromPicker ? '<button class="pill busy" id="ncChg" type="button">Chanje kont</button>' : '') + '</div>'
    + '<div class="card" style="margin-top:10px"><div class="row">' + avatar(c, true) + '<div class="grow"><div class="name">' + esc(c.prenom + " " + c.nom) + '</div>'
    + '<div class="sub">' + kodHtml(c.code_client, c.telephone) + '</div></div></div>'
    + '<div class="kv" style="margin-top:8px"><div>Kont</div><div><b>' + esc(k ? (k._local ? "Nouvo kont (ap tann)" : k.numero) : "Nouvo kont · ap ouvri otomatikman") + '</b></div>'
    + '<div>Cycle anvan</div><div>' + nbAv + (prev ? ' · dènye a : ' + htg(prev.fonds_debloques) + ', ' + prev.nb_jours_prevu + ' jou, ' + htg(prev.frais_journalier) + '/jou' : '') + '</div>'
    + (lim ? '<div>Limit kont lan</div><div class="money">' + htg(lim) + '</div>' : '') + '</div></div>'
    + (prev ? '<div class="sub">Montan, jou ak frè yo soti nan dènye cycle a. Chanje sa ki pa bon.</div>' : '')
    + '<label for="ncM">Montan pou debloke (HTG) *</label><input id="ncM" class="big" type="number" inputmode="numeric" min="1" step="50" value="' + (prev ? Math.round(prev.fonds_debloques) : "") + '">'
    + '<label>Konbyen jou *</label><div class="chips" id="ncJ">' + [1,2,3,4,5,6,7].map(n => '<button class="chip' + (n === jou ? " sel" : "") + '" data-j="' + n + '" type="button">' + n + '</button>').join("") + '</div>'
    + '<label>Frè pa jou *</label><div class="chips" id="ncF">' + fr.map(f => '<button class="chip' + (f === frais ? " sel" : "") + '" data-f="' + f + '" type="button">' + htg(f) + '</button>').join("") + '</div>'
    + '<label for="ncD">Dat kòmansman</label><input id="ncD" type="date" value="' + today() + '" min="' + addDays(today(), -7) + '">'
    + '<label class="switch"><input id="ncDim" type="checkbox"' + (dim ? " checked" : "") + '><span><b>Pa konte dimanch</b></span></label>'
    + '<label class="switch"><input id="ncDeb" type="checkbox" checked><span><b>M ap bay kliyan an kòb la kounye a</b><br><span class="sub">Déblocage a ap anrejistre an menm tan.</span></span></label>'
    + '<div class="card" id="ncSum" style="margin-top:10px"></div>'
    + '<button class="btn" id="ncOk" type="button">Kreye cycle la</button><button class="btn ghost" id="ncNo" type="button">Anile</button>');
  const sum = () => { const m = Number($("#ncM").value) || 0, y = calcLocal({ date_debut: $("#ncD").value || today(), nb_jours_prevu: jou, dimanches_exclus: dim, frais_journalier: frais || 0, fonds_debloques: m });
    $("#ncSum").innerHTML = '<div class="kv"><div>Fen cycle la</div><div>' + dmy(y.date_fin_prevue) + '</div><div>Frè total (si l fè tout jou yo)</div><div class="money">' + htg(jou * (frais || 0)) + '</div><div>Kliyan an ap remèt</div><div class="money">' + htg(m) + '</div></div>'; };
  document.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { jou = +b.dataset.j; document.querySelectorAll("[data-j]").forEach(x => x.classList.toggle("sel", x === b)); sum(); });
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { frais = +b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("sel", x === b)); sum(); });
  $("#ncM").oninput = sum; $("#ncD").onchange = sum; $("#ncDim").onchange = e => { dim = e.target.checked; sum(); }; $("#ncDeb").onchange = e => deb = e.target.checked; sum();
  $("#ncNo").onclick = closeSheet;
  const chg = $("#ncChg"); if (chg) chg.onclick = openCyclePicker;
  $("#ncOk").onclick = async () => {
    const m = Math.round(Number($("#ncM").value)), d = $("#ncD").value;
    if (!(m > 0)) return toast("Mete montan an.", true);
    if (lim && m > lim) return toast("Montan an depase limit kont lan (" + htg(lim) + ").", true);
    if (!frais) return toast("Chwazi frè pa jou a.", true);
    if (!d) return toast("Chwazi dat kòmansman an.", true);
    if (!confirm("Cycle " + jou + " jou · " + htg(m) + " · " + htg(frais) + "/jou\n" + c.prenom + " " + c.nom + (deb ? "\n\nW ap bay kliyan an " + htg(m) + " kounye a." : "") + "\n\nKonfime?")) return;
    $("#ncOk").disabled = true;
    if (!k) {   // kliyan an pa gen kont : ouvri youn otomatikman
      const kid = uuid();
      await enqueue("ouvrir", { p_id: kid, p_client: c.id, p_capture_le: new Date().toISOString() }, "Kont " + c.prenom + " " + c.nom);
      k = { id: kid, client_id: c.id, numero: "(ap tann)", statut: "Actif", _local: true }; S.comptes.push(k); save("comptes");
    }
    const row = { id: uuid(), compte_id: k.id, date_debut: d, nb_jours_prevu: jou, fonds_debloques: m, frais_journalier: frais, dimanches_exclus: dim };
    await enqueue("cycle", row, "Cycle " + jou + " jou · " + htg(m) + " · " + c.prenom + " " + c.nom);
    const y = calcLocal({ ...row, numero: "(ap tann)", statut: "Prévu", jours_repos: [], frais_payes: 0, fonds_restitue: 0, fonds_decaisse: 0, penalites_payees: 0, _local: true });
    S.cycles.unshift(y);
    if (deb) {
      let g = null; try { g = await getGPS(8000); } catch {}
      const okg = g && !g.err && g.acc <= 500;
      const t = { id: uuid(), cycle_id: row.id, type: "Déblocage du fonds", montant: m, date_operation: today(), mode_paiement: "Espèces", reference: null, commentaire: null,
        agent_id: S.moi.user_id, gps_lat: okg ? g.lat : null, gps_lng: okg ? g.lng : null, gps_precision_m: okg ? g.acc : null, capture_le: new Date().toISOString(), appareil: (navigator.userAgent || "").slice(0, 120) };
      await enqueue("tx", t, "Déblocage " + htg(m) + " · " + c.prenom + " " + c.nom);
      S.tx.unshift({ ...t, _local: true }); applyTxLocal(t); save("tx");
    }
    save("cycles"); toast("Cycle kreye ✔" + (S.online ? "" : " (ap voye lè entènèt tounen)"));
    if (opts.back) { closeSheet(); render(); } else openClient(c.id);
  };
}

  });

function openOp(y, type){
  const c = clientOfCycle(y);
  const def = type === "Paiement frais" ? (+y.frais_en_retard > 0 ? y.frais_en_retard : y.frais_journalier)
    : type === "Restitution du fonds" ? y.fonds_a_restituer
    : type === "Déblocage du fonds" ? Math.max(0, +y.fonds_debloques - +y.fonds_decaisse) : "";
  let gps = null, mode = "Espèces";
  sheet('<div class="name" style="font-size:20px">' + esc(type) + '</div><div class="sub">' + esc(c ? c.prenom + " " + c.nom : "") + ' · ' + esc(y.numero) + '</div>'
    + '<label for="opM">Montan (HTG)</label><input id="opM" class="big" type="number" inputmode="decimal" min="1" step="1" value="' + (def ? Math.round(def) : "") + '">'
    + (type === "Paiement frais" ? '<div class="chips">' + [1,2,3].map(n => '<button class="chip" data-n="' + n + '" type="button">' + n + ' jou · ' + htg(n * y.frais_journalier) + '</button>').join("") + '</div>' : '')
    + '<label>Mòd peman</label><div class="chips" id="opMode">' + CFG.modes.map(x => '<button class="chip' + (x === mode ? " sel" : "") + '" data-m="' + esc(x) + '" type="button">' + esc(x) + '</button>').join("") + '</div>'
    + '<label for="opR">Referans (si se MonCash, NatCash…)</label><input id="opR" type="text" autocomplete="off">'
    + '<label for="opC">Kòmantè</label><input id="opC" type="text" autocomplete="off">'
    + '<div id="opG">' + gpsHtml(null) + '</div>'
    + '<button class="btn" id="opOk" type="button">Anrejistre</button><button class="btn ghost" id="opNo" type="button">Anile</button>');
  getGPS(15000).then(g => { gps = g; const b = $("#opG"); if (b) b.innerHTML = gpsHtml(g); });
  document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { $("#opM").value = b.dataset.n * y.frais_journalier; });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll("[data-m]").forEach(x => x.classList.toggle("sel", x === b)); });
  $("#opNo").onclick = closeSheet;
  $("#opOk").onclick = async () => {
    const m = Math.round(Number($("#opM").value));
    if (!(m > 0)) return toast("Mete yon montan.", true);
    if (type === "Déblocage du fonds" && m > +y.fonds_debloques - +y.fonds_decaisse) return toast("Montan an depase sa ki rete pou debloke (" + htg(+y.fonds_debloques - +y.fonds_decaisse) + ").", true);
    if (type === "Restitution du fonds" && m > +y.fonds_a_restituer) { if (!confirm("Montan an plis pase sa kliyan an dwe remèt (" + htg(y.fonds_a_restituer) + "). Kontinye?")) return; }
    if (!confirm(type + " · " + htg(m) + "\n" + (c ? c.prenom + " " + c.nom : "") + "\n\nKonfime?")) return;
    $("#opOk").disabled = true;
    const ok = gps && !gps.err && gps.acc <= 500;
    const t = { id: uuid(), cycle_id: y.id, type, montant: m, date_operation: today(), mode_paiement: mode,
      reference: $("#opR").value.trim() || null, commentaire: $("#opC").value.trim() || null, agent_id: S.moi.user_id,
      gps_lat: ok ? gps.lat : null, gps_lng: ok ? gps.lng : null, gps_precision_m: ok ? gps.acc : null,
      capture_le: new Date().toISOString(), appareil: (navigator.userAgent || "").slice(0, 120) };
    await enqueue("tx", t, type + " " + htg(m) + " · " + (c ? c.prenom + " " + c.nom : ""));
    S.tx.unshift({ ...t, _local: true }); applyTxLocal(t); save("tx"); save("cycles");
    closeSheet(); toast(type + " anrejistre ✔" + (S.online ? "" : " (ap voye lè entènèt tounen)")); render();
  };
}

/* ================= POZISYON AN DIRÈK + SWIVI PAKOU ================= */
S.pos = null; let watchId = null, lastRec = null;
const TRACK = () => !!S.moi && S.moi.role === "agent";            // se sèlman ajan yo ki swiv
const inHaiti = g => g.lat >= 17.5 && g.lat <= 20.5 && g.lng >= -75 && g.lng <= -71.5;
function startWatch(){
  if (!navigator.geolocation || watchId !== null || !S.session) return;
  watchId = navigator.geolocation.watchPosition(p => onPos(posOf(p)), () => { S.posErr = true; renderNet(); },
    { enableHighAccuracy: true, maximumAge: 20000, timeout: 60000 });
  renderNet();
}
function stopWatch(){ if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } renderNet(); }
const posOf = p => ({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), spd: p.coords.speed, at: new Date(p.timestamp || Date.now()).toISOString() });
let posQ = Promise.resolve();
function onPos(g){
  S.pos = g; S.posErr = false;
  updateDistances(); if (S.map) katMe();
  if (!TRACK() || g.acc > 100 || !inHaiti(g)) return;
  const now = Date.parse(g.at);
  if (lastRec && distM(lastRec, g) < 30 && now - Date.parse(lastRec.at) < 55000) return;   // yon pwen chak minit oswa chak 30 m
  lastRec = g;
  posQ = posQ.then(async () => {
    const q = (await DB.get("kv", "posQueue")) || [];
    q.push({ id: uuid(), agent_id: S.moi.user_id, lat: g.lat, lng: g.lng, precision_m: g.acc, vitesse_ms: g.spd ?? null, capture_le: g.at });
    if (q.length > 6000) q.splice(0, q.length - 6000);
    await DB.set("kv", "posQueue", q);
  }).catch(() => {});
}
// Lè ajan an pa deplase, telefòn nan pa voye nouvo pozisyon : mande youn chak minit
setInterval(() => { if (watchId !== null && document.visibilityState === "visible" && TRACK())
  navigator.geolocation.getCurrentPosition(p => onPos(posOf(p)), () => {
    // Telefòn nan pa bay nouvo pozisyon paske l pa deplase : ajan an toujou nan menm kote a
    if (S.pos && Date.now() - Date.parse(S.pos.at) < 300000) onPos({ ...S.pos, at: new Date().toISOString() });
  }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 }); }, 60000);

async function pushPositions(){
  await posQ;
  let q = ((await DB.get("kv", "posQueue")) || []).filter(p => S.moi && p.agent_id === S.moi.user_id);
  while (q.length) {
    const b = q.slice(0, 300);
    try { await http("/rest/v1/debloke_positions?on_conflict=id", { method: "POST", body: b, headers: { Prefer: "resolution=ignore-duplicates,return=minimal" } }); }
    catch (e) { if (e.status === 0 || e.code === "relogin") throw e; }      // lòt erè : pa bloke fil la
    const ids = new Set(b.map(x => x.id)), cur = (await DB.get("kv", "posQueue")) || [];
    await DB.set("kv", "posQueue", cur.filter(x => !ids.has(x.id)));
    q = q.slice(300);
  }
}

/* Distans ak tan pou rive bò kliyan an (estimasyon : wout ≈ 1,3 × liy dwat) */
const ROAD = 1.3, V_PYE = 4.5, V_MOTO = 20;
const fmtD = d => d < 1000 ? Math.round(d / 10) * 10 + " m" : (d / 1000).toFixed(d < 10000 ? 1 : 0).replace(".", ",") + " km";
const mins = (d, v) => Math.max(1, Math.round(d / 1000 / v * 60));
function etaText(lat, lng){
  if (!S.pos || lat == null || lat === "") return "";
  const d = distM(S.pos, { lat: +lat, lng: +lng }) * ROAD;
  return "📍 " + fmtD(d) + " · 🚶 " + mins(d, V_PYE) + " min · 🛵 " + mins(d, V_MOTO) + " min";
}
const etaSpan = c => c && c.gps_lat != null ? '<div class="eta" data-lat="' + c.gps_lat + '" data-lng="' + c.gps_lng + '">' + etaText(c.gps_lat, c.gps_lng) + '</div>' : '';
function updateDistances(){ document.querySelectorAll(".eta[data-lat]").forEach(e => { const t = etaText(e.dataset.lat, e.dataset.lng); if (e.textContent !== t) e.textContent = t; }); }

/* Pakou optimize : vwazen ki pi pre + amelyorasyon 2-opt (wout ouvè, pa retounen) */
function optimize(start, pts){
  const s = start ? [start] : [], rest = pts.slice();
  let cur = start || rest.shift(); if (!start) s.push(cur);
  while (rest.length) { let bi = 0, bd = Infinity; rest.forEach((p, i) => { const d = distM(cur, p); if (d < bd) { bd = d; bi = i; } }); cur = rest.splice(bi, 1)[0]; s.push(cur); }
  const D = (a, b) => (a && b ? distM(a, b) : 0);
  for (let it = 0, imp = true; imp && it < 60; it++) {
    imp = false;
    for (let i = 1; i < s.length - 1; i++) for (let j = i + 1; j < s.length; j++) {
      const delta = D(s[i - 1], s[j]) + D(s[i], s[j + 1]) - D(s[i - 1], s[i]) - D(s[j], s[j + 1]);
      if (delta < -1) { s.splice(i, j - i + 1, ...s.slice(i, j + 1).reverse()); imp = true; }
    }
  }
  return start ? s.slice(1) : s;
}
function katOptim(list, bounds){
  const k = S.kat, panel = $("#mPanel");
  let pts = list.filter(c => cyclesOfClient(c.id).some(isOpen));
  const tous = !pts.length; if (tous) pts = list.slice();
  let start = null, startLbl = "";
  if (isMgr() && k.agent) { const r = (k.last && k.last.rows || []).find(x => x.agent_id === k.agent); if (r) { start = { lat: r.lat, lng: r.lng }; startLbl = "Dènye pozisyon " + nomAgent(k.agent); } }
  if (!start && S.pos) { start = { lat: S.pos.lat, lng: S.pos.lng }; startLbl = "Kote w ye kounye a"; }
  if (!pts.length) { panel.innerHTML = '<div class="empty">Pa gen kliyan ki gen pozisyon GPS' + (isMgr() && !k.agent ? " (chwazi yon ajan)" : "") + '.</div>'; return; }
  if (pts.length > 60) { const ref = start || pts[0]; pts = pts.map(c => ({ c, d: distM(ref, { lat: c.gps_lat, lng: c.gps_lng }) })).sort((a, b) => a.d - b.d).slice(0, 60).map(x => x.c); }
  const tour = optimize(start, pts.map(c => ({ lat: c.gps_lat, lng: c.gps_lng, c })));
  const line = (start ? [[start.lat, start.lng]] : []).concat(tour.map(p => [p.lat, p.lng]));
  L.polyline(line, { color: "#7B1E28", weight: 4, opacity: .85, dashArray: "8 8" }).addTo(S.layers.route);
  if (start) L.marker([start.lat, start.lng], { icon: pinIcon("#1F6FB2", "▶", "num"), zIndexOffset: 800 }).bindPopup("<b>Depa</b><br>" + esc(startLbl)).addTo(S.layers.route);
  let cum = 0, prev = start; const rows = [];
  tour.forEach((p, i) => {
    const leg = prev ? distM(prev, p) * ROAD : 0; cum += leg; prev = p;
    const col = ST[clientState(p.c)].c;
    L.marker([p.lat, p.lng], { icon: pinIcon(col, String(i + 1), "num"), zIndexOffset: 500 }).bindPopup(popHtml(p.c), { minWidth: 220 }).addTo(S.layers.route);
    bounds.push([p.lat, p.lng]);
    rows.push('<div class="it" style="--c:' + col + '"><div class="card" data-client="' + p.c.id + '" style="margin:0"><div class="row"><span class="num" style="background:' + col + '">' + (i + 1) + '</span>' + avatar(p.c)
      + '<div class="grow"><div class="name" style="font-size:15px">' + esc(p.c.prenom + " " + p.c.nom) + '</div><div class="sub">' + (i || start ? "+" + fmtD(leg) + " · 🛵 " + mins(leg, V_MOTO) + " min" : "Premye kliyan") + '</div></div>'
      + '<div class="sub" style="text-align:right">🛵 ' + mins(cum, V_MOTO) + ' min<br>🚶 ' + mins(cum, V_PYE) + ' min</div></div></div></div>');
  });
  const wp = tour.slice(0, -1).slice(0, 9).map(p => p.lat + "," + p.lng).join("|"), last = tour[tour.length - 1];
  const gm = "https://www.google.com/maps/dir/?api=1" + (start ? "&origin=" + start.lat + "," + start.lng : "") + "&destination=" + last.lat + "," + last.lng + (wp ? "&waypoints=" + encodeURIComponent(wp) : "") + "&travelmode=driving";
  panel.innerHTML = '<div class="kpis"><div class="kpi"><b>' + tour.length + '</b><span>' + (tous ? "Kliyan (tout)" : "Kliyan ak cycle aktif") + '</span></div><div class="kpi"><b>' + fmtD(cum) + '</b><span>Distans total</span></div><div class="kpi"><b>' + mins(cum, V_MOTO) + ' min</b><span>🛵 Moto (🚶 ' + mins(cum, V_PYE) + ' min)</span></div></div>'
    + '<div class="sub" style="margin:8px 2px">' + (start ? "Depa : " + esc(startLbl) + ". " : "Aktive GPS la pou pakou a kòmanse kote w ye. ") + 'Tan yo se estimasyon (wout ≈ 1,3 × distans an liy dwat), san tan pou fè koleksyon an.</div>'
    + '<a class="btn sec" style="text-align:center;text-decoration:none" href="' + gm + '" target="_blank" rel="noopener">🗺️ Swiv pakou a nan Google Maps' + (tour.length > 10 ? " (10 premye yo)" : "") + '</a>'
    + '<h3>Lòd vizit la</h3><div class="tl">' + rows.join("") + '</div>';
  hydrate(panel);
}

/* Pakou yon ajan pou yon jou : wout, kanpe, tan bò chak kliyan */
function detectStops(pts, rad = 40, minMs = 180000){
  const out = []; let i = 0;
  while (i < pts.length) {
    let j = i + 1; const a = pts[i];
    while (j < pts.length && distM(a, pts[j]) <= rad) j++;
    const d = Date.parse(pts[j - 1].capture_le) - Date.parse(a.capture_le);
    if (j - 1 > i && d >= minMs) {
      const sub = pts.slice(i, j);
      out.push({ lat: sub.reduce((s, p) => s + p.lat, 0) / sub.length, lng: sub.reduce((s, p) => s + p.lng, 0) / sub.length, from: a.capture_le, to: pts[j - 1].capture_le, dur: d });
      i = j;
    } else i++;
  }
  return out;
}
async function katPakou(bounds){
  const k = S.kat, panel = $("#mPanel");
  if (!k.agent) { panel.innerHTML = '<div class="empty">Chwazi yon ajan.</div>'; return; }
  if (!k.track || k.track.key !== k.agent + k.date) {
    if (!S.online) { panel.innerHTML = '<div class="empty">Pakou ajan an bezwen entènèt.</div>'; return; }
    panel.innerHTML = '<div class="sub" style="margin-top:10px">Ap chaje pakou a…</div>';
    const d0 = new Date(k.date + "T00:00:00").toISOString(), d1 = new Date(addDays(k.date, 1) + "T00:00:00").toISOString();
    try {
      const pts = await sel("debloke_positions", "select=lat,lng,precision_m,capture_le&agent_id=eq." + k.agent + "&capture_le=gte." + encodeURIComponent(d0) + "&capture_le=lt." + encodeURIComponent(d1) + "&order=capture_le.asc&limit=5000");
      k.track = { key: k.agent + k.date, pts: pts.filter(p => (p.precision_m || 0) <= 100) };
    } catch (e) { panel.innerHTML = '<div class="err-msg">' + esc(e.message) + '</div>'; return; }
  }
  const pts = k.track.pts, col = agColor(k.agent);
  if (!pts.length) { panel.innerHTML = '<div class="empty">Pa gen pozisyon pou ' + esc(nomAgent(k.agent)) + ' ' + (k.date === today() ? "jodi a" : "nan dat sa a") + '.<br><span class="sub">Ajan an dwe gen app la louvri pou pakou a anrejistre.</span></div>'; return; }
  L.polyline(pts.map(p => [p.lat, p.lng]), { color: col, weight: 5, opacity: .8 }).addTo(S.layers.route);
  pts.forEach(p => bounds.push([p.lat, p.lng]));
  const a = pts[0], z = pts[pts.length - 1];
  L.marker([a.lat, a.lng], { icon: pinIcon("#2F7D32", "▶", "num"), zIndexOffset: 800 }).bindPopup("<b>Kòmanse</b> " + hhmm(a.capture_le)).addTo(S.layers.route);
  L.marker([z.lat, z.lng], { icon: pinIcon("#C0352B", "■", "num"), zIndexOffset: 800 }).bindPopup("<b>Dènye pozisyon</b> " + hhmm(z.capture_le)).addTo(S.layers.route);
  // Distans pakouri (inyore so GPS ki pa reyèl)
  let km = 0; for (let i = 1; i < pts.length; i++) { const d = distM(pts[i - 1], pts[i]); if (d < 3000) km += d; }
  // Kanpe → vizit kliyan
  const mine = S.clients.filter(c => c.agent_id === k.agent && c.gps_lat != null), all = S.clients.filter(c => c.gps_lat != null);
  const stops = detectStops(pts).map(s => {
    let best = null, bd = 80;
    (mine.length ? mine : all).forEach(c => { const d = distM(s, { lat: c.gps_lat, lng: c.gps_lng }); if (d < bd) { bd = d; best = c; } });
    if (!best) all.forEach(c => { const d = distM(s, { lat: c.gps_lat, lng: c.gps_lng }); if (d < bd) { bd = d; best = c; } });
    const txs = best ? S.tx.filter(t => { const y = S.cycles.find(x => x.id === t.cycle_id); return y && clientOfCycle(y) && clientOfCycle(y).id === best.id
      && Date.parse(t.capture_le) >= Date.parse(s.from) - 600000 && Date.parse(t.capture_le) <= Date.parse(s.to) + 600000; }) : [];
    return { ...s, c: best, txs };
  });
  stops.forEach(s => L.marker([s.lat, s.lng], { icon: pinIcon(s.c ? col : "#7A6A6C", "⏱", "num"), zIndexOffset: 700 })
    .bindPopup("<b>" + (s.c ? esc(s.c.prenom + " " + s.c.nom) : "Kanpe") + "</b><br>" + hhmm(s.from) + " → " + hhmm(s.to) + " · <b>" + dur(s.dur) + "</b>").addTo(S.layers.route));
  // Twou (app fèmen / pa gen siyal)
  const gaps = []; for (let i = 1; i < pts.length; i++) { const g = Date.parse(pts[i].capture_le) - Date.parse(pts[i - 1].capture_le); if (g > 15 * 60000) gaps.push({ from: pts[i - 1].capture_le, to: pts[i].capture_le, g }); }
  const visits = stops.filter(s => s.c), tVis = visits.reduce((t, s) => t + s.dur, 0);
  const events = stops.map(s => ({ t: s.from, h: s.c
      ? '<div class="it" style="--c:' + col + '"><div class="card" data-client="' + s.c.id + '" style="margin:0"><div class="row">' + avatar(s.c) + '<div class="grow"><div class="name" style="font-size:15px">' + esc(s.c.prenom + " " + s.c.nom) + '</div><div class="sub">' + hhmm(s.from) + ' → ' + hhmm(s.to)
        + (s.txs.length ? ' · ' + s.txs.map(t => (TX_ICO[t.type] || "") + " " + htg(t.montant)).join(", ") : ' · pa gen operasyon') + '</div></div><span class="tag ok">⏱ ' + dur(s.dur) + '</span></div></div></div>'
      : '<div class="it" style="--c:#7A6A6C"><div class="sub" style="padding:6px 0">⏸ Kanpe ' + dur(s.dur) + ' (' + hhmm(s.from) + ' → ' + hhmm(s.to) + '), pa toupre okenn kliyan</div></div>' }))
    .concat(gaps.map(g => ({ t: g.from, h: '<div class="it" style="--c:#B26A00"><div class="sub" style="padding:6px 0;color:var(--warn)">⚠️ Pa gen pozisyon ' + hhmm(g.from) + ' → ' + hhmm(g.to) + ' (' + dur(g.g) + ') : app la te fèmen oswa pa t gen siyal GPS</div></div>' })))
    .sort((x, y) => String(x.t).localeCompare(String(y.t)));
  panel.innerHTML = '<div class="kpis"><div class="kpi"><b>' + hhmm(a.capture_le) + '</b><span>Kòmanse</span></div><div class="kpi"><b>' + hhmm(z.capture_le) + '</b><span>Dènye pozisyon</span></div><div class="kpi"><b>' + fmtD(km) + '</b><span>Distans pakouri</span></div>'
    + '<div class="kpi"><b>' + visits.length + '</b><span>Vizit kliyan</span></div><div class="kpi"><b>' + dur(tVis) + '</b><span>Tan bò kliyan</span></div><div class="kpi"><b>' + dur(Date.parse(z.capture_le) - Date.parse(a.capture_le)) + '</b><span>Tan sou teren</span></div></div>'
    + '<div class="sub" style="margin:8px 2px">Yon vizit = ajan an rete omwen 3 min nan menm kote a (± 40 m), a mwens pase 80 m de yon kliyan.</div>'
    + '<h3>Jounen ' + esc(nomAgent(k.agent)) + '</h3>' + (events.length ? '<div class="tl">' + events.map(e => e.h).join("") + '</div>' : '<div class="sub">Pa gen kanpe detekte.</div>');
  hydrate(panel);
}

    const prev = S.moi && S.moi.user_id;
    if (prev && prev !== S.session.user_id) {   // lòt ajan sou menm telefòn : efase done ansyen an (outbox li rete)
      for (const k of ["clients","comptes","cycles","tx"]) { S[k] = []; await DB.del("kv", k); }
    }
    S.moi = { user_id: S.session.user_id, telephone: tel, nom: "", role: "" };
    await pull(); S.lastSync = new Date().toISOString(); save("lastSync");
    if (!S.moi.role) { S.session = null; await DB.del("kv", "session"); throw new Error("Kont sa a pa yon kont Debloke aktif."); }
    $("#lPwd").value = ""; S.needRelogin = false; showApp(); sync();
  } catch (e) {
    $("#lErr").textContent = /invalid/i.test(e.message) ? "Telefòn oswa modpas pa bon." : /banned/i.test(e.message) ? "Kont sa a dezaktive." : e.message;
  } finally { $("#lBtn").disabled = false; $("#lBtn").textContent = "Konekte"; }
};
$("#lPwd").addEventListener("keydown", e => { if (e.key === "Enter") $("#lBtn").click(); });

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { S.page = b.dataset.p; closeSheet(); render(); window.scrollTo(0, 0); });
$("#main").addEventListener("click", e => {
  const y = e.target.closest("[data-cycle]"); if (y) return openCycle(y.dataset.cycle);
  const c = e.target.closest("[data-client]"); if (c) return openClient(c.dataset.client);
});
$("#hNet").onclick = () => sync(true);
window.addEventListener("online", () => { S.online = true; renderNet(); sync(); });
window.addEventListener("offline", () => { S.online = false; renderNet(); });
setInterval(() => { if (S.online && S.session && document.visibilityState === "visible") sync(); }, 120000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { if (S.session && !$("#vApp").classList.contains("hidden")) startWatch(); if (S.online && S.session) sync(); }
  else stopWatch();
});

const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
(async function start(){
  if (CFG.test) $("#testBanner").classList.remove("hidden");
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // Nouvo vèsyon : montre yon bann pou rechaje (done yo pa efase)
      reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => {
        if (w.state === "activated" && hadController) $("#upd").classList.remove("hidden"); }); });
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
  }
  $("#upd").onclick = () => location.reload();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  await loadState();
  if (S.session && S.moi && S.moi.role) { showApp(); if (S.online) sync(); }
  else showLogin();
})();
</script>
</body>
