<style>
:root{
  --bg:#FAF5EE; --card:#fff; --ink:#2B1B1E; --muted:#7A6A6C; --line:#EDE3DA;
  --brand:#7B1E28; --brand-2:#5E141C; --brand-soft:#F8E9EA; --cream:#F6E7C8;
  --ok:#2F7D32; --ok-soft:#E6F3E6; --warn:#A35C00; --warn-soft:#FCF0DE; --err:#C0352B; --err-soft:#FCE9E7;
  --radius:14px; --shadow:0 1px 2px rgba(70,25,30,.06),0 6px 18px rgba(70,25,30,.08);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#191214; --card:#241A1C; --ink:#F3E9E6; --muted:#B5A3A5; --line:#3A2C2F;
    --brand-soft:#3A1E23; --ok-soft:#1E3320; --warn-soft:#3A2A12; --err-soft:#3D1D1A; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header .logo{font-weight:800;letter-spacing:.5px;font-size:18px}
header .who{font-size:13px;opacity:.85;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;border:0;cursor:pointer}
.pill.on{background:#E6F3E6;color:#1F5E22}.pill.off{background:#FCF0DE;color:#7A4300}.pill.busy{background:var(--cream);color:var(--brand-2)}
.test{background:#FFD54A;color:#3A2A00;text-align:center;font-size:12px;font-weight:700;padding:3px}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .i{font-size:22px;line-height:1}
nav button.act{color:var(--brand);font-weight:700}

h2{font-size:18px;margin:14px 0 8px}
h3{font-size:15px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:700;font-size:16px}

.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.err{background:var(--err-soft);color:var(--err)}.tag.n{background:var(--line);color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;background:var(--brand);color:#fff;margin:8px 0}

.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn{margin:0}
.btns > *{min-width:0}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none;min-height:48px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
.big{font-size:26px;font-weight:800;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}
.chip.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.search{position:sticky;top:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:20;background:#2B1B1E;color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;box-shadow:var(--shadow);max-width:600px;margin:0 auto}
.toast.err{background:var(--err)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.gps{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.gps.ok{background:var(--ok-soft);color:var(--ok)}.gps.wait{background:var(--warn-soft);color:var(--warn)}.gps.err{background:var(--err-soft);color:var(--err)}
.photo{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--line);display:block}
.switch{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;margin-top:10px}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login .mark{width:72px;height:72px;border-radius:18px;background:var(--brand);color:var(--cream);font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.err-msg{color:var(--err);font-weight:600;margin-top:8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--brand)}

<script>
"use strict";
/* ================= KONFIGIRASYON ================= */
const CFG = {
  url: "https://riutfmqffpffniutbhue.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdXRmbXFmZnBmZm5pdXRiaHVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NzYwMjMsImV4cCI6MjEwOTM1MjAyM30.esDd_orfWwlGtRCDz4DDKH9Pwnz6R7mVHWilqNVkn74",
  test: true,
  domen: "ajan.debloke.invalid",
  bucket: "debloke-photos",
  frais: [100,150,250,350,500,750,1000,1250],
  modes: ["Espèces","MonCash","NatCash","Virement bancaire","Autre"],
  activites: ["Restaurant","Fritay / vente de rue","Pâtisserie","Boissons / jus","Épicerie","Autre"],
  emplacements: ["Marché","Boutique","Bord de rue","Maison","Ambulant","Autre"]
};

/* ================= ZOUTI ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const htg = n => (Math.round(Number(n || 0))).toLocaleString("fr-HT").replace(/ | /g, " ") + " HTG";
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const dmy = s => s ? s.slice(8,10) + "/" + s.slice(5,7) + "/" + s.slice(0,4) : "";
const hm = s => { try { const d = new Date(s); return d.toLocaleDateString("fr-HT") + " " + d.toLocaleTimeString("fr-HT",{hour:"2-digit",minute:"2-digit"}); } catch { return s; } };
function normTel(t){ let d = String(t||"").replace(/\D/g,""); if (d.length === 8) d = "509" + d; return /^509\d{8}$/.test(d) ? d : null; }
function toast(msg, err){ const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), err ? 5000 : 2600); }

/* ================= STOKAJ LOKAL (IndexedDB) ================= */
const DB = {
  _db: null,
  open(){ return this._db || (this._db = new Promise((ok, ko) => {
    const r = indexedDB.open("debloke-ajan", 1);
    r.onupgradeneeded = () => { const d = r.result;
      d.createObjectStore("kv"); d.createObjectStore("outbox", { keyPath: "seq", autoIncrement: true }); d.createObjectStore("photos"); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  })); },
  async tx(store, mode, fn){ const d = await this.open(); return new Promise((ok, ko) => {
    const t = d.transaction(store, mode), s = t.objectStore(store); let res;
    Promise.resolve(fn(s)).then(v => res = v);
    t.oncomplete = () => ok(res); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); }); },
  req(r){ return new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  get(store, k){ return this.tx(store, "readonly", s => this.req(s.get(k))); },
  set(store, k, v){ return this.tx(store, "readwrite", s => k === undefined ? this.req(s.put(v)) : this.req(s.put(v, k))); },
  del(store, k){ return this.tx(store, "readwrite", s => this.req(s.delete(k))); },
  all(store){ return this.tx(store, "readonly", s => this.req(s.getAll())); },
  clear(store){ return this.tx(store, "readwrite", s => this.req(s.clear())); }
};

/* ================= ETA ================= */
const S = {
  session: null, moi: null,          // moi = {user_id, nom, role, telephone}
  clients: [], comptes: [], cycles: [], tx: [], baremes: [], equipe: [], remplacements: [], filtreAgent: "",
  outbox: [], lastSync: null, online: navigator.onLine, syncing: false, page: "jodi", q: ""
};
async function loadState(){
  for (const k of ["session","moi","clients","comptes","cycles","tx","baremes","lastSync","equipe","remplacements"]) {
    const v = await DB.get("kv", k); if (v !== undefined) S[k] = v;
  }
  S.outbox = await DB.all("outbox");
}
const save = k => DB.set("kv", k, S[k]);

/* ================= API SUPABASE ================= */
class ApiErr extends Error { constructor(msg, status, code){ super(msg); this.status = status; this.code = code; } }
async function http(path, { method = "GET", body, headers = {}, auth = true, raw = false } = {}){
  const h = { apikey: CFG.key, ...headers };
  if (auth) { await ensureToken(); h.Authorization = "Bearer " + S.session.access_token; }
  if (body !== undefined && !(body instanceof Blob)) { h["Content-Type"] = "application/json"; body = JSON.stringify(body); }
  let r;
  try { r = await fetch(CFG.url + path, { method, headers: h, body }); }
  catch (e) { throw new ApiErr("Pa gen koneksyon", 0, "network"); }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok) {
    const msg = (j && (j.message || j.msg || j.error_description || j.erè || j.error)) || ("Erè " + r.status);
    throw new ApiErr(msg, r.status, j && (j.code || j.error_code));
  }
  return raw ? txt : j;
}
async function login(tel, pwd){
  const j = await http("/auth/v1/token?grant_type=password", { method: "POST", auth: false,
    body: { email: tel + "@" + CFG.domen, password: pwd } });
  setSession(j);
}
function setSession(j){
  S.session = { access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in || 3600)), user_id: j.user && j.user.id };
  save("session");
}
async function ensureToken(){
  if (!S.session) throw new ApiErr("Ou pa konekte", 401, "no_session");
  if (S.session.expires_at - 60 > Date.now()/1000) return;
  try {
    const j = await http("/auth/v1/token?grant_type=refresh_token", { method: "POST", auth: false, body: { refresh_token: S.session.refresh_token } });
    setSession(j);
  } catch (e) {
    if (e.status === 0) throw e;
    S.needRelogin = true; throw new ApiErr("Sesyon an fini. Konekte ankò (done ki pa voye yo ap rete).", 401, "relogin");
  }
}
const rpc = (fn, args) => http("/rest/v1/rpc/" + fn, { method: "POST", body: args || {} });
const sel = (t, q) => http("/rest/v1/" + t + "?" + q);
const ins = (t, row) => http("/rest/v1/" + t, { method: "POST", body: row, headers: { Prefer: "return=minimal" } });
const patch = (t, q, row) => http("/rest/v1/" + t + "?" + q, { method: "PATCH", body: row, headers: { Prefer: "return=minimal" } });
const kontFn = body => http("/functions/v1/debloke-kont", { method: "POST", body });
const isMgr = () => !!S.moi && ["manager","responsable","admin"].includes(S.moi.role);
const isAdm = () => !!S.moi && ["responsable","admin"].includes(S.moi.role);
const nomAgent = id => { const p = S.equipe.find(x => x.user_id === id); return p ? p.nom : (S.moi && id === S.moi.user_id ? S.moi.nom : ""); };

/* ================= GPS ================= */
function getGPS(timeout = 20000){
  return new Promise(res => {
    if (!navigator.geolocation) return res({ err: "Telefòn sa a pa gen GPS." });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: new Date(p.timestamp).toISOString() }),
      e => res({ err: e.code === 1 ? "Ou pa bay app la otorizasyon GPS. Aktive l nan paramèt telefòn nan." : "GPS la pa jwenn pozisyon. Ale deyò oswa eseye ankò." }),
      { enableHighAccuracy: true, timeout, maximumAge: 0 });
  });
}
const gpsHtml = g => !g ? '<div class="gps wait">📍 Ap chèche pozisyon GPS…</div>'
  : g.err ? '<div class="gps err">📍 ' + esc(g.err) + '</div>'
  : g.acc > 200 ? '<div class="gps err">📍 Pozisyon pa presi ase (±' + g.acc + ' m). Eseye ankò.</div>'
  : '<div class="gps ok">📍 Pozisyon anrejistre (±' + g.acc + ' m)</div>';

/* ================= FOTO ================= */
function compressImage(file, max = 1280, q = 0.72){
  return new Promise((ok, ko) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : ko(new Error("foto")), "image/jpeg", q); };
    img.onerror = () => { URL.revokeObjectURL(u); ko(new Error("Foto a pa ka li.")); };
    img.src = u;
  });
}

/* ================= OUTBOX (operasyon k ap tann) ================= */
async function enqueue(kind, payload, label){
  const item = { kind, payload, label, created: new Date().toISOString(), status: "pending", error: null, user_id: S.moi && S.moi.user_id };
  item.seq = await DB.set("outbox", undefined, item);
  S.outbox.push(item); renderBadge();
  if (S.online) sync();
  return item;
}

async function pushOne(it){
  const p = it.payload;
  switch (it.kind) {
    case "photo": {
      const blob = await DB.get("photos", p.key);
      if (blob) {
        try { await http("/storage/v1/object/" + CFG.bucket + "/" + p.path, { method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" } }); }
        catch (e) { if (!(e.status === 409 || /exists|duplicate/i.test(e.message))) throw e; }   // deja voye
        await DB.del("photos", p.key);
      }
      return;
    }
    case "inscrire": return rpc("debloke_inscrire_client", p);
    case "ouvrir": {
      const r = await rpc("debloke_ouvrir_compte", p);
      const k = S.comptes.find(x => x.id === p.p_id); if (k && r && r.numero) { k.numero = r.numero; k._local = false; save("comptes"); }
      return r;
    }
    case "gps": return rpc("debloke_enregistrer_gps_commerce", p);
    case "tx":
      try { return await ins("debloke_transactions", p); }
      catch (e) { if (e.code === "23505") return; throw e; }      // deja voye
    case "off":
      try { return await ins("debloke_jours_off", p); }
      catch (e) { if (e.code === "23505") return; throw e; }
    case "cycle":
      try { return await ins("debloke_cycles", p); }
      catch (e) { if (e.code === "23505") return; throw e; }
    case "cloture": return rpc("debloke_cloturer_cycle", p);
    case "remplacement":
      try { return await ins("debloke_remplacements", p); }
      catch (e) { if (e.code === "23505") return; throw e; }
    case "annule_rp": return patch("debloke_remplacements", "id=eq." + p.id, { annule: true });
    case "transfert": return rpc("debloke_transferer_client", p);
  }
}

async function sync(manual){
  if (S.syncing) return;
  if (!S.online) { if (manual) toast("Pa gen entènèt. Done yo ap voye lè entènèt tounen.", true); return; }
  S.syncing = true; renderNet();
  let ok = 0, fail = 0;
  try {
    const items = (await DB.all("outbox")).filter(i => i.status !== "done");
    for (const it of items) {
      if (it.user_id && S.moi && it.user_id !== S.moi.user_id) continue;   // pa voye done yon lòt ajan
      try { await pushOne(it); await DB.del("outbox", it.seq); ok++; }
      catch (e) {
        if (e.status === 0) throw e;                                    // koneksyon koupe : kanpe
        if (e.code === "relogin") throw e;
        it.status = "error"; it.error = e.message; it.tries = (it.tries || 0) + 1; await DB.set("outbox", undefined, it); fail++;
      }
    }
    await pull();
    S.lastSync = new Date().toISOString(); save("lastSync");
    if (manual || ok || fail) toast(fail ? (fail + " operasyon pa pase. Gade nan Senk.") : (ok ? ok + " operasyon voye ✔" : "Tout bagay ajou ✔"), !!fail);
  } catch (e) {
    if (e.code === "relogin") { toast(e.message, true); showLogin(true); }
    else if (manual) toast(e.message, true);
  } finally {
    S.outbox = await DB.all("outbox"); S.syncing = false; renderNet(); renderBadge(); render();
  }
}

async function pull(){
  const [moi, clients, comptes, cycles, baremes] = await Promise.all([
    sel("debloke_personnel", "select=user_id,nom,role,telephone&user_id=eq." + S.session.user_id),
    sel("debloke_v_clients", "select=*&order=nom.asc"),
    sel("debloke_comptes", "select=id,numero,client_id,statut,limite_autorisee,date_ouverture&order=date_ouverture.desc"),
    sel("debloke_v_cycles", "select=*&statut=not.in.(Annulé)&order=date_debut.desc&limit=500"),
    sel("debloke_baremes_frais", "select=frais_journalier&actif=eq.true&order=frais_journalier.asc")
  ]);
  const ids = cycles.filter(c => !/Terminé/.test(c.statut) || c.date_debut >= addDays(today(), -30)).map(c => c.id);
  let tx = [];
  if (ids.length) tx = await sel("debloke_transactions", "select=id,cycle_id,type,montant,sens,affectation,date_operation,mode_paiement,capture_le,agent_id&order=capture_le.desc&limit=1000&cycle_id=in.(" + ids.join(",") + ")");
  if (moi[0]) { S.moi = moi[0]; save("moi"); }
  if (isMgr()) {
    const [eq, rp] = await Promise.all([
      sel("debloke_personnel", "select=user_id,nom,role,telephone,actif&order=nom.asc"),
      sel("debloke_remplacements", "select=*&annule=eq.false&au=gte." + addDays(today(), -1) + "&order=du.asc")
    ]);
    S.equipe = eq; S.remplacements = rp; save("equipe"); save("remplacements");
  }
  // Kenbe done lokal ki poko pase
  const pend = await DB.all("outbox");
  const pendClients = new Set(pend.filter(i => i.kind === "inscrire").map(i => i.payload.p_id));
  const pendComptes = new Set(pend.filter(i => i.kind === "ouvrir").map(i => i.payload.p_id));
  const pendCycles = new Set(pend.filter(i => i.kind === "cycle").map(i => i.payload.id));
  const pendClot = new Map(pend.filter(i => i.kind === "cloture").map(i => [i.payload.p_cycle, i.payload.p_date_fin]));
  const pendTx = new Set(pend.filter(i => i.kind === "tx").map(i => i.payload.id));
  S.clients = clients.concat(S.clients.filter(c => c._local && pendClients.has(c.id) && !clients.some(x => x.id === c.id)));
  S.comptes = comptes.concat(S.comptes.filter(c => c._local && pendComptes.has(c.id) && !comptes.some(x => x.id === c.id)));
  S.cycles = cycles.concat(S.cycles.filter(y => y._local && pendCycles.has(y.id) && !cycles.some(x => x.id === y.id)));
  S.cycles.forEach(y => { if (pendClot.has(y.id) && isOpen(y)) { y.statut = "Terminé"; y._closing = true; } });
  const localTx = S.tx.filter(t => t._local && pendTx.has(t.id) && !tx.some(x => x.id === t.id));
  S.tx = tx.concat(localTx);
  localTx.forEach(applyTxLocal);
  S.baremes = baremes.map(b => Number(b.frais_journalier));
  for (const k of ["clients","comptes","cycles","tx","baremes"]) await save(k);
}
function addDays(s, n){ const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }

/* Kalandriye lokal (pou cycle kreye san entènèt) : menm règ ak sèvè a */
function calcLocal(y){
  const off = new Set(y.jours_repos || []), jours = [];
  for (let d = y.date_debut, i = 0; jours.length < y.nb_jours_prevu && i < 60; d = addDays(d, 1), i++) {
    const dow = new Date(d + "T12:00:00").getDay();
    if ((y.dimanches_exclus && dow === 0) || off.has(dow)) continue;
    jours.push(d);
  }
  const fin = y.date_fin_reelle && y.date_fin_reelle < today() ? y.date_fin_reelle : today();
  y.date_fin_prevue = jours[jours.length - 1]; y.date_limite = y.prolonge_jusqu_au || y.date_fin_prevue;
  y.jours_consommes = jours.filter(d => d <= fin).length;
  y.frais_dus = y.jours_consommes * y.frais_journalier; y.frais_total_prevu = y.nb_jours_prevu * y.frais_journalier;
  y.frais_en_retard = Math.max(0, y.frais_dus - (+y.frais_payes || 0));
  y.fonds_a_restituer = +y.fonds_debloques - (+y.fonds_restitue || 0);
  return y;
}

/* Mete chif cycle la ajou lokalman (san entènèt) */
function applyTxLocal(t){
  const c = S.cycles.find(x => x.id === t.cycle_id); if (!c) return;
  const m = Number(t.montant);
  if (t.type === "Paiement frais") { c.frais_payes = +c.frais_payes + m; c.frais_en_retard = Math.max(0, +c.frais_dus - c.frais_payes); }
  if (t.type === "Restitution du fonds") { c.fonds_restitue = +c.fonds_restitue + m; c.fonds_a_restituer = +c.fonds_debloques - c.fonds_restitue; }
  if (t.type === "Déblocage du fonds") { c.fonds_decaisse = +c.fonds_decaisse + m; if (c.statut === "Prévu") c.statut = "Actif"; }
  if (t.type === "Pénalité") { c.penalites_payees = +c.penalites_payees + m; }
}

    $("#ncSum").innerHTML = '<div class="kv"><div>Fen cycle la</div><div>' + dmy(y.date_fin_prevue) + '</div><div>Frè total (si l fè tout jou yo)</div><div class="money">' + htg(jou * (frais || 0)) + '</div><div>Kliyan an ap remèt</div><div class="money">' + htg(m) + '</div></div>'; };
  document.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { jou = +b.dataset.j; document.querySelectorAll("[data-j]").forEach(x => x.classList.toggle("sel", x === b)); sum(); });
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { frais = +b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("sel", x === b)); sum(); });
  $("#ncM").oninput = sum; $("#ncD").onchange = sum; $("#ncDim").onchange = e => { dim = e.target.checked; sum(); }; $("#ncDeb").onchange = e => deb = e.target.checked; sum();
  $("#ncNo").onclick = closeSheet;
  $("#ncOk").onclick = async () => {
    const m = Math.round(Number($("#ncM").value)), d = $("#ncD").value;
    if (!(m > 0)) return toast("Mete montan an.", true);
    if (lim && m > lim) return toast("Montan an depase limit kont lan (" + htg(lim) + ").", true);
    if (!frais) return toast("Chwazi frè pa jou a.", true);
    if (!d) return toast("Chwazi dat kòmansman an.", true);
    if (!confirm("Cycle " + jou + " jou · " + htg(m) + " · " + htg(frais) + "/jou\n" + c.prenom + " " + c.nom + (deb ? "\n\nW ap bay kliyan an " + htg(m) + " kounye a." : "") + "\n\nKonfime?")) return;
    $("#ncOk").disabled = true;
    const row = { id: uuid(), compte_id: k.id, date_debut: d, nb_jours_prevu: jou, fonds_debloques: m, frais_journalier: frais, dimanches_exclus: dim };
    await enqueue("cycle", row, "Cycle " + jou + " jou · " + htg(m) + " · " + c.prenom + " " + c.nom);
    const y = calcLocal({ ...row, numero: "(ap tann)", statut: "Prévu", jours_repos: [], frais_payes: 0, fonds_restitue: 0, fonds_decaisse: 0, penalites_payees: 0, _local: true });
    S.cycles.unshift(y);
    if (deb) {
      let g = null; try { g = await getGPS(8000); } catch {}
      const okg = g && !g.err && g.acc <= 500;
      const t = { id: uuid(), cycle_id: row.id, type: "Déblocage du fonds", montant: m, date_operation: today(), mode_paiement: "Espèces", reference: null, commentaire: null,
        agent_id: S.moi.user_id, gps_lat: okg ? g.lat : null, gps_lng: okg ? g.lng : null, gps_precision_m: okg ? g.acc : null, capture_le: new Date().toISOString(), appareil: (navigator.userAgent || "").slice(0, 120) };
      await enqueue("tx", t, "Déblocage " + htg(m) + " · " + c.prenom + " " + c.nom);
      S.tx.unshift({ ...t, _local: true }); applyTxLocal(t); save("tx");
    }
    save("cycles"); closeSheet(); toast("Cycle kreye ✔" + (S.online ? "" : " (ap voye lè entènèt tounen)")); openClient(c.id);
  };
}

/* ================= EKRAN MANAGER ================= */
function renderEkip(m){
  const open = S.cycles.filter(isOpen);

  open.forEach(y => { const c = clientOfCycle(y), a = (c && c.agent_id) || "?"; const o = parAgent[a] = parAgent[a] || { n: 0, dehors: 0, reta: 0 };
    o.n++; o.dehors += Math.max(0, +y.fonds_a_restituer); o.reta += +y.frais_en_retard || 0; });
  const tot = Object.values(parAgent).reduce((s, o) => ({ n: s.n + o.n, dehors: s.dehors + o.dehors, reta: s.reta + o.reta }), { n: 0, dehors: 0, reta: 0 });
  const agents = S.equipe.filter(p => p.actif !== false);
  const opt = (list, ph) => '<option value="">' + ph + '</option>' + list.map(p => '<option value="' + p.user_id + '">' + esc(p.nom) + ' (' + esc(p.role) + ')</option>').join("");
  m.innerHTML = '<h2>Ekip</h2><div class="card"><div class="kv"><div>Cycle aktif</div><div><b>' + tot.n + '</b></div><div>Fon deyò</div><div class="money">' + htg(tot.dehors) + '</div><div>Frè an reta</div><div class="money">' + htg(tot.reta) + '</div></div></div>'
    + '<h3>Pa ajan</h3>' + (Object.keys(parAgent).length ? Object.entries(parAgent).map(([a, o]) => '<div class="card"><div class="row"><div class="grow"><div class="name">' + esc(nomAgent(a) || "—") + '</div><div class="sub">' + o.n + ' cycle · fon deyò ' + htg(o.dehors) + '</div></div>' + (o.reta > 0 ? '<span class="tag warn">Reta ' + htg(o.reta) + '</span>' : '<span class="tag ok">Ajou</span>') + '</div></div>').join("") : '<div class="sub">Pa gen cycle aktif.</div>')
    + '<h3>Ranplasman</h3>' + (S.remplacements.length ? S.remplacements.map(r => '<div class="card"><div class="row"><div class="grow"><div class="name" style="font-size:15px">' + esc(nomAgent(r.remplacant)) + ' ranplase ' + esc(nomAgent(r.titulaire)) + '</div><div class="sub">' + dmy(r.du) + ' → ' + dmy(r.au) + (r.client_id ? ' · 1 kliyan' : ' · tout kliyan') + (r.motif ? ' · ' + esc(r.motif) : '') + (r._local ? ' · ap tann' : '') + '</div></div>'
        + (r._local ? '' : '<button class="pill off" data-rpx="' + r.id + '" type="button">Anile</button>') + '</div></div>').join("") : '<div class="sub">Pa gen ranplasman.</div>')
    + '<div class="card"><label for="rpT">Ajan ki p ap la</label><select id="rpT">' + opt(agents, "Chwazi…") + '</select>'
    + '<label for="rpR">Ajan k ap ranplase l</label><select id="rpR">' + opt(agents, "Chwazi…") + '</select>'
    + '<div class="btns" style="margin-top:6px"><div><label for="rpD">Soti</label><input id="rpD" type="date" value="' + today() + '"></div><div><label for="rpA">Rive</label><input id="rpA" type="date" value="' + today() + '"></div></div>'
    + '<label for="rpM">Rezon</label><input id="rpM" placeholder="Egz. malad, konje…"><button class="btn" id="rpOk" type="button">Kreye ranplasman an</button></div>'
    + '<h3>Transfè yon kliyan</h3><div class="card"><label for="tfC">Kliyan</label><select id="tfC"><option value="">Chwazi…</option>'
    + S.clients.filter(c => !c._local).sort((a, b) => (a.nom + a.prenom).localeCompare(b.nom + b.prenom)).map(c => '<option value="' + c.id + '">' + esc(c.prenom + " " + c.nom) + ' — ' + esc(nomAgent(c.agent_id) || "?") + '</option>').join("") + '</select>'
    + '<label for="tfA">Nouvo ajan</label><select id="tfA">' + opt(agents.filter(p => p.role === "agent"), "Chwazi…") + '</select>'
    + '<label for="tfM">Rezon</label><input id="tfM"><button class="btn" id="tfOk" type="button">Transfere kliyan an</button></div>'
    + '<h3>Anplwaye</h3>' + S.equipe.map(p => '<div class="card"><div class="row"><div class="grow"><div class="name" style="font-size:15px">' + esc(p.nom) + '</div><div class="sub">' + esc(p.telephone) + ' · ' + esc(p.role) + '</div></div>'
        + (p.actif === false ? '<span class="tag err">Dezaktive</span>' : '<span class="tag ok">Aktif</span>') + '</div>'
        + (isAdm() && p.user_id !== S.moi.user_id ? '<div class="btns" style="margin-top:8px"><button class="btn sec" data-pw="' + esc(p.telephone) + '" type="button">Nouvo modpas</button><button class="btn ghost" data-act="' + esc(p.telephone) + '" data-on="' + (p.actif === false ? 1 : 0) + '" type="button">' + (p.actif === false ? "Reaktive" : "Dezaktive") + '</button></div>' : '') + '</div>').join("")
    + (isAdm() ? '<h3>Nouvo kont anplwaye</h3><div class="card"><p class="sub" style="margin-top:0">Bezwen entènèt.</p><label for="kaN">Non konplè</label><input id="kaN"><label for="kaT">Telefòn</label><input id="kaT" type="tel" inputmode="tel" placeholder="3700 1234">'
      + '<label for="kaR">Wòl</label><select id="kaR"><option value="agent">Ajan</option><option value="analyste">Analis</option><option value="manager">Manager</option>' + (S.moi.role === "admin" ? '<option value="responsable">Responsab liy</option><option value="admin">Admin</option>' : '') + '</select>'
      + '<label for="kaP">Modpas (8 karaktè omwen)</label><input id="kaP" type="text" autocomplete="off"><button class="btn" id="kaOk" type="button">Kreye kont lan</button></div>' : '');

  m.querySelectorAll("[data-rpx]").forEach(b => b.onclick = async () => {
    if (!confirm("Anile ranplasman sa a?")) return;
    await enqueue("annule_rp", { id: b.dataset.rpx }, "Anile ranplasman");
    S.remplacements = S.remplacements.filter(r => r.id !== b.dataset.rpx); save("remplacements"); renderEkip(m);
  });
  $("#rpOk").onclick = async () => {
    const t = $("#rpT").value, r = $("#rpR").value, du = $("#rpD").value, au = $("#rpA").value;
    if (!t || !r) return toast("Chwazi 2 ajan yo.", true);
    if (t === r) return toast("Se pa menm ajan an ki ka ranplase tèt li.", true);
    if (!du || !au || au < du) return toast("Dat yo pa bon.", true);
    const row = { id: uuid(), titulaire: t, remplacant: r, du, au, motif: $("#rpM").value.trim() || null, cree_par: S.moi.user_id };
    await enqueue("remplacement", row, "Ranplasman " + nomAgent(t) + " → " + nomAgent(r));
    S.remplacements.push({ ...row, _local: true }); save("remplacements"); toast("Ranplasman anrejistre ✔"); renderEkip(m);
  };
  $("#tfOk").onclick = async () => {
    const c = clientById($("#tfC").value), a = $("#tfA").value;
    if (!c || !a) return toast("Chwazi kliyan an ak nouvo ajan an.", true);
    if (c.agent_id === a) return toast("Kliyan an deja nan men ajan sa a.", true);
    if (!confirm("Transfere " + c.prenom + " " + c.nom + " bay " + nomAgent(a) + "?")) return;
    await enqueue("transfert", { p_client: c.id, p_nouvel_agent: a, p_motif: $("#tfM").value.trim() || null }, "Transfè " + c.prenom + " " + c.nom + " → " + nomAgent(a));
    c.agent_id = a; save("clients"); toast("Transfè anrejistre ✔"); renderEkip(m);
  };
  const online = fn => async (...a) => { if (!S.online) return toast("Fòk ou gen entènèt pou sa.", true); try { await fn(...a); } catch (e) { toast(e.message, true); } };
  m.querySelectorAll("[data-pw]").forEach(b => b.onclick = online(async () => {
    const pw = prompt("Nouvo modpas pou " + b.dataset.pw + " (8 karaktè omwen) :"); if (!pw) return;
    if (pw.length < 8) return toast("Modpas la twò kout.", true);
    await kontFn({ aksyon: "modpas", telefon: b.dataset.pw, modpas: pw }); toast("Modpas chanje ✔. Bay moun nan li.");
  }));
  m.querySelectorAll("[data-act]").forEach(b => b.onclick = online(async () => {
    const on = b.dataset.on === "1"; if (!confirm((on ? "Reaktive" : "Dezaktive") + " kont " + b.dataset.act + "?")) return;
    await kontFn({ aksyon: on ? "reactiver" : "desactiver", telefon: b.dataset.act });
    const p = S.equipe.find(x => x.telephone === b.dataset.act); if (p) p.actif = on; save("equipe"); toast("Fèt ✔"); renderEkip(m);
  }));
  const ka = $("#kaOk"); if (ka) ka.onclick = online(async () => {
    const non = $("#kaN").value.trim(), tel = normTel($("#kaT").value), wol = $("#kaR").value, pw = $("#kaP").value;
    if (non.length < 2) return toast("Mete non an.", true);
    if (!tel) return toast("Telefòn nan pa bon.", true);
    if (pw.length < 8) return toast("Modpas la dwe gen 8 karaktè omwen.", true);
    ka.disabled = true;
    try { const r = await kontFn({ aksyon: "creer", telefon: tel, non, wol, modpas: pw });
      S.equipe.push({ user_id: r.user_id, nom: non, role: wol, telephone: tel, actif: true }); save("equipe");
      toast("Kont " + non + " kreye ✔"); renderEkip(m); }
    finally { ka.disabled = false; }
  });
}

function openOp(y, type){
  const c = clientOfCycle(y);
  const def = type === "Paiement frais" ? (+y.frais_en_retard > 0 ? y.frais_en_retard : y.frais_journalier)
    : type === "Restitution du fonds" ? y.fonds_a_restituer
    : type === "Déblocage du fonds" ? Math.max(0, +y.fonds_debloques - +y.fonds_decaisse) : "";
  let gps = null, mode = "Espèces";
  sheet('<div class="name" style="font-size:20px">' + esc(type) + '</div><div class="sub">' + esc(c ? c.prenom + " " + c.nom : "") + ' · ' + esc(y.numero) + '</div>'
    + '<label for="opM">Montan (HTG)</label><input id="opM" class="big" type="number" inputmode="decimal" min="1" step="1" value="' + (def ? Math.round(def) : "") + '">'
    + (type === "Paiement frais" ? '<div class="chips">' + [1,2,3].map(n => '<button class="chip" data-n="' + n + '" type="button">' + n + ' jou · ' + htg(n * y.frais_journalier) + '</button>').join("") + '</div>' : '')
    + '<label>Mòd peman</label><div class="chips" id="opMode">' + CFG.modes.map(x => '<button class="chip' + (x === mode ? " sel" : "") + '" data-m="' + esc(x) + '" type="button">' + esc(x) + '</button>').join("") + '</div>'
    + '<label for="opR">Referans (si se MonCash, NatCash…)</label><input id="opR" type="text" autocomplete="off">'
    + '<label for="opC">Kòmantè</label><input id="opC" type="text" autocomplete="off">'
    + '<div id="opG">' + gpsHtml(null) + '</div>'
    + '<button class="btn" id="opOk" type="button">Anrejistre</button><button class="btn ghost" id="opNo" type="button">Anile</button>');
  getGPS(15000).then(g => { gps = g; const b = $("#opG"); if (b) b.innerHTML = gpsHtml(g); });
  document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { $("#opM").value = b.dataset.n * y.frais_journalier; });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll("[data-m]").forEach(x => x.classList.toggle("sel", x === b)); });
  $("#opNo").onclick = closeSheet;
  $("#opOk").onclick = async () => {
    const m = Math.round(Number($("#opM").value));
    if (!(m > 0)) return toast("Mete yon montan.", true);
    if (type === "Déblocage du fonds" && m > +y.fonds_debloques - +y.fonds_decaisse) return toast("Montan an depase sa ki rete pou debloke (" + htg(+y.fonds_debloques - +y.fonds_decaisse) + ").", true);
    if (type === "Restitution du fonds" && m > +y.fonds_a_restituer) { if (!confirm("Montan an plis pase sa kliyan an dwe remèt (" + htg(y.fonds_a_restituer) + "). Kontinye?")) return; }
    if (!confirm(type + " · " + htg(m) + "\n" + (c ? c.prenom + " " + c.nom : "") + "\n\nKonfime?")) return;
    $("#opOk").disabled = true;
    const ok = gps && !gps.err && gps.acc <= 500;
    const t = { id: uuid(), cycle_id: y.id, type, montant: m, date_operation: today(), mode_paiement: mode,
      reference: $("#opR").value.trim() || null, commentaire: $("#opC").value.trim() || null, agent_id: S.moi.user_id,
      gps_lat: ok ? gps.lat : null, gps_lng: ok ? gps.lng : null, gps_precision_m: ok ? gps.acc : null,
      capture_le: new Date().toISOString(), appareil: (navigator.userAgent || "").slice(0, 120) };
    await enqueue("tx", t, type + " " + htg(m) + " · " + (c ? c.prenom + " " + c.nom : ""));
    S.tx.unshift({ ...t, _local: true }); applyTxLocal(t); save("tx"); save("cycles");
    closeSheet(); toast(type + " anrejistre ✔" + (S.online ? "" : " (ap voye lè entènèt tounen)")); render();
  };
}

    if (F.compte) {
      const kid = uuid();
      await enqueue("ouvrir", { p_id: kid, p_client: cid, p_capture_le: now }, "Kont " + p + " " + n);
      S.comptes.push({ id: kid, client_id: cid, numero: "(ap tann)", statut: "Actif", _local: true }); save("comptes");
    }
    if (F.photoUrl) URL.revokeObjectURL(F.photoUrl);
    F = null; toast("Kliyan anrejistre ✔" + (S.online ? "" : " (ap voye lè entènèt tounen)"));
    S.page = "kliyan"; render();
  };
}

/* ---------- Senkronizasyon ---------- */
function renderSenk(m){
  const items = S.outbox.filter(i => i.status !== "done");
  m.innerHTML = '<h2>Senkronizasyon</h2><div class="card"><div class="kv">'
    + '<div>Entènèt</div><div>' + (S.online ? "✔ wi" : "✖ non") + '</div>'
    + '<div>Ap tann</div><div><b>' + items.length + '</b> operasyon</div>'
    + '<div>Dènye senk</div><div>' + (S.lastSync ? hm(S.lastSync) : "—") + '</div></div></div>'
    + '<button class="btn" id="sGo" type="button"' + (S.syncing ? " disabled" : "") + '>🔄 Senkronize kounye a</button>'
    + (items.length ? '<h3>Operasyon k ap tann</h3>' + items.map(i => '<div class="card"><div class="row"><div class="grow"><div class="name" style="font-size:15px">' + esc(i.label || i.kind) + '</div><div class="sub">' + hm(i.created) + '</div>'
        + (i.error ? '<div class="err-msg" style="font-size:13px">' + esc(i.error) + '</div>' : '') + '</div>'
        + (i.status === "error" ? '<button class="pill off" data-del="' + i.seq + '" type="button">Retire</button>' : '<span class="tag n">Ap tann</span>') + '</div></div>').join("")
      : '<div class="empty">✔ Tout done yo voye.</div>')
    + '<h3>Kont</h3><div class="card"><div class="kv"><div>Non</div><div>' + esc(S.moi && S.moi.nom) + '</div><div>Telefòn</div><div>' + esc(S.moi && S.moi.telephone) + '</div><div>Wòl</div><div>' + esc(S.moi && S.moi.role) + '</div></div></div>'
    + '<button class="btn ghost" id="sOut" type="button">Dekonekte</button>';
  $("#sGo").onclick = () => sync(true);
  m.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Retire operasyon sa a? Li p ap janm voye.")) return;
    await DB.del("outbox", Number(b.dataset.del)); S.outbox = await DB.all("outbox"); renderBadge(); render();
  });
  $("#sOut").onclick = async () => {
    const n = S.outbox.filter(i => i.status !== "done").length;
    if (n && !confirm(n + " operasyon poko voye. Si w dekonekte, yo ap rete sou telefòn nan epi y ap voye lè w konekte ankò. Kontinye?")) return;
    S.session = null; await DB.del("kv", "session"); showLogin();
  };
}

/* ---------- Sheet ---------- */
function sheet(html){ $("#sheetBody").innerHTML = '<div class="grab"></div>' + html; $("#sheet").classList.remove("hidden"); $("#sheetBody").scrollTop = 0;
  $("#sheetBody").querySelectorAll("[data-cycle]").forEach(e => e.onclick = () => openCycle(e.dataset.cycle)); }
function closeSheet(){ $("#sheet").classList.add("hidden"); $("#sheetBody").innerHTML = ""; }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

/* ================= DEMARAJ ================= */
function showLogin(relog){
  $("#vApp").classList.add("hidden"); $("#vLogin").classList.remove("hidden");
  if (relog && S.moi) $("#lTel").value = S.moi.telephone || "";
}
async function showApp(){
  $("#vLogin").classList.add("hidden"); $("#vApp").classList.remove("hidden");
  renderNet(); renderBadge(); render();
}
$("#lBtn").onclick = async () => {
  const tel = normTel($("#lTel").value), pwd = $("#lPwd").value;
  $("#lErr").textContent = "";
  if (!tel) return $("#lErr").textContent = "Nimewo telefòn nan pa bon.";
  if (!pwd) return $("#lErr").textContent = "Mete modpas ou.";
  if (!navigator.onLine) return $("#lErr").textContent = "Premye koneksyon an bezwen entènèt.";
  $("#lBtn").disabled = true; $("#lBtn").textContent = "Ap konekte…";
  try {
    await login(tel, pwd);
    const prev = S.moi && S.moi.user_id;
    if (prev && prev !== S.session.user_id) {   // lòt ajan sou menm telefòn : efase done ansyen an (outbox li rete)
      for (const k of ["clients","comptes","cycles","tx"]) { S[k] = []; await DB.del("kv", k); }
    }
    S.moi = { user_id: S.session.user_id, telephone: tel, nom: "", role: "" };
    await pull(); S.lastSync = new Date().toISOString(); save("lastSync");
    if (!S.moi.role) { S.session = null; await DB.del("kv", "session"); throw new Error("Kont sa a pa yon kont Debloke aktif."); }
    $("#lPwd").value = ""; S.needRelogin = false; showApp(); sync();
  } catch (e) {
    $("#lErr").textContent = /invalid/i.test(e.message) ? "Telefòn oswa modpas pa bon." : /banned/i.test(e.message) ? "Kont sa a dezaktive." : e.message;
  } finally { $("#lBtn").disabled = false; $("#lBtn").textContent = "Konekte"; }
};
$("#lPwd").addEventListener("keydown", e => { if (e.key === "Enter") $("#lBtn").click(); });

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { S.page = b.dataset.p; closeSheet(); render(); window.scrollTo(0, 0); });
$("#main").addEventListener("click", e => {
  const y = e.target.closest("[data-cycle]"); if (y) return openCycle(y.dataset.cycle);
  const c = e.target.closest("[data-client]"); if (c) return openClient(c.dataset.client);
});
$("#hNet").onclick = () => sync(true);
window.addEventListener("online", () => { S.online = true; renderNet(); sync(); });
window.addEventListener("offline", () => { S.online = false; renderNet(); });
setInterval(() => { if (S.online && S.session && document.visibilityState === "visible") sync(); }, 120000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.online && S.session) sync(); });

(async function start(){
  if (CFG.test) $("#testBanner").classList.remove("hidden");
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  await loadState();
  if (S.session && S.moi && S.moi.role) { showApp(); if (S.online) sync(); }
  else showLogin();
})();
</script>
</body>
</html>
